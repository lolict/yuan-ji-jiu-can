<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mlll · 囡囝容器面板</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0f; color:#e0e0e0; font-family:'Courier New',monospace; font-size:13px; overflow:hidden; height:100vh; }
  .main { display:grid; grid-template-columns:1fr 260px; grid-template-rows:1fr auto; height:100vh; gap:2px; }

  .cart-panel { background:#111118; padding:10px; overflow-y:auto; grid-row:1; }
  .cart-title { font-size:11px; color:#555; margin-bottom:6px; letter-spacing:1px; }
  .anchors { display:flex; gap:6px; margin-bottom:8px; }
  .anchor-block { padding:4px 10px; border-radius:3px; font-size:10px; font-weight:bold; cursor:pointer; }
  .anchor-wo { background:#1a3a5c; color:#7ec8e3; border:1px solid #2a5a7c; }
  .anchor-cht { background:#3a1a3c; color:#e37ea0; border:1px solid #5a2a5c; }

  .cart-grid { display:grid; grid-template-columns:repeat(14,1fr); gap:2px; }
  .cart-slot { aspect-ratio:1; border:1px solid #1a1a1a; border-radius:2px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:9px; color:#444; transition:all 0.15s; position:relative; }
  .cart-slot:hover { border-color:#444; }
  .cart-slot.occup { background:#1a2a1a; border-color:#2a4a2a; color:#6a9a6a; }
  .cart-slot.selected { border-color:#ffcc00; box-shadow:0 0 3px rgba(255,204,0,0.5); z-index:2; }
  .cart-slot.cursor { box-shadow:inset 0 0 0 2px #ffcc00; }
  .cart-slot .slot-num { position:absolute; top:0px; left:1px; font-size:7px; color:#333; }
  .cart-slot.just-injected { animation:pulse 1s ease-out; }
  @keyframes pulse { 0% { box-shadow:0 0 8px #ffcc00; } 100% { box-shadow:none; } }

  .reg-panel { background:#111118; padding:10px; grid-row:1; overflow-y:auto; }
  .reg-title { font-size:11px; color:#555; margin-bottom:6px; letter-spacing:1px; }
  .reg-list { display:flex; flex-direction:column; gap:2px; }
  .reg-entry { display:flex; align-items:center; gap:5px; padding:4px 7px; border:1px solid #1a1a1a; border-radius:2px; font-size:10px; cursor:pointer; }
  .reg-entry:hover { border-color:#444; }
  .reg-entry.active { border-color:#7ec8e3; background:#0a1a2a; }
  .reg-idx { color:#555; width:20px; }
  .reg-val { color:#7ec8e3; flex:1; word-break:break-all; font-family:monospace; font-size:9px; }

  .vm-status { margin-top:8px; padding:6px; background:#0a0a0f; border:1px solid #222; border-radius:2px; font-size:9px; color:#777; line-height:1.6; }
  .vm-status span { color:#aaa; }
  .detail-box { margin-top:8px; padding:6px; background:#0a0a0f; border:1px solid #2a2a3a; border-radius:2px; font-size:9px; line-height:1.7; }
  .detail-label { color:#555; }
  .detail-val { color:#ccc; }
  .detail-polarity-yin { color:#e37ea0; }
  .detail-polarity-yang { color:#7ec8e3; }

  .intent-panel { grid-column:1/3; background:#0d0d14; padding:8px 14px; border-top:1px solid #222; }
  .intent-row { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .intent-row:last-child { margin-bottom:0; }
  .intent-label { color:#444; font-size:10px; width:50px; text-align:right; letter-spacing:1px; }

  .syllable-group { display:flex; flex-wrap:wrap; gap:2px; }
  .syll-btn { padding:2px 6px; border:1px solid #2a2a2a; background:#111; color:#888; border-radius:2px; cursor:pointer; font-size:10px; font-family:monospace; }
  .syll-btn:hover { border-color:#555; color:#ccc; }
  .syll-btn.active { border-color:#ffcc00; color:#ffcc00; background:#1a1a0a; }

  .call-btn { padding:5px 14px; background:#1a1a2a; border:1px solid #3a3a4a; color:#bbb; border-radius:2px; cursor:pointer; font-size:10px; letter-spacing:1px; }
  .call-btn:hover { background:#2a2a3a; border-color:#ffcc00; color:#ffcc00; }
  .call-btn.primary { background:#2a1a3a; border-color:#6a4a8a; color:#ccc; }
  .call-btn.primary:hover { background:#3a2a4a; border-color:#ffcc00; color:#ffcc00; }

  .op-row { display:flex; gap:3px; flex-wrap:wrap; }
  .op-btn { padding:2px 7px; border:1px solid #2a2a2a; background:#111; color:#777; border-radius:2px; cursor:pointer; font-size:10px; }
  .op-btn:hover { border-color:#7ec8e3; color:#7ec8e3; }
  .op-btn.active { border-color:#7ec8e3; background:#0a1a2a; color:#7ec8e3; }

  .log-box { margin-top:8px; padding:6px; background:#0a0a0f; border:1px solid #1a1a1a; border-radius:2px; max-height:80px; overflow-y:auto; font-size:9px; color:#555; line-height:1.5; font-family:monospace; }
  .log-entry { padding:1px 0; }
  .log-ok { color:#5a8a5a; }
  .log-err { color:#8a5a5a; }
  .log-info { color:#5a6a8a; }
  .log-judge-admit { color:#7ec8e3; }
  .log-judge-reject { color:#e37ea0; }

  .syll-preview { display:inline-block; padding:2px 8px; background:#1a1a0a; border:1px solid #3a3a2a; border-radius:2px; color:#ffcc00; font-size:11px; margin-left:8px; }
</style>
</head>
<body>
<div class="main">

  <div class="cart-panel">
    <div class="cart-title">字车 MLLL · 254+2</div>
    <div class="anchors">
      <div class="anchor-block anchor-cht" id="anchor-0" onclick="showAnchor(0)">刘楚恬 · 0 · 阴</div>
      <div class="anchor-block anchor-wo" id="anchor-1" onclick="showAnchor(1)">我 · 1 · 阳</div>
    </div>
    <div class="cart-grid" id="cartGrid"></div>
    <div class="log-box" id="logBox"></div>
  </div>

  <div class="reg-panel">
    <div class="reg-title">寄存器组 · 16</div>
    <div class="reg-list" id="regList"></div>
    <div class="vm-status" id="vmStatus">
      PC: <span id="stPc">0</span>　SP: <span id="stSp">0</span><br>
      状态: <span id="stRun">就绪</span>　裁判: <span id="stAdmit">—</span>
    </div>
    <div class="detail-box">
      <span class="detail-label">选中的容器</span>
      <div id="detInfo" style="margin-top:4px;">点击字车槽查看</div>
    </div>
    <div class="detail-box" style="margin-top:6px;">
      <span class="detail-label">发音意图</span>
      <div id="syllPreview" class="syll-preview" style="margin-top:4px;">— · — · —</div>
    </div>
  </div>

  <div class="intent-panel">
    <div class="intent-row">
      <span class="intent-label">声母</span>
      <div class="syllable-group" id="shengmuGroup"></div>
    </div>
    <div class="intent-row">
      <span class="intent-label">韵母</span>
      <div class="syllable-group" id="yunmuGroup"></div>
    </div>
    <div class="intent-row">
      <span class="intent-label">声调</span>
      <div class="syllable-group" id="toneGroup"></div>
      <button class="call-btn primary" onclick="encodeAndInject()" style="margin-left:12px;">编码 → 注入字车</button>
    </div>
    <div class="intent-row">
      <span class="intent-label">操作</span>
      <div class="op-row" id="opRow"></div>
      <button class="call-btn" style="margin-left:10px;" onclick="callOp()">呼唤执行</button>
      <button class="call-btn" onclick="resetVM()">重置</button>
      <button class="call-btn" onclick="seedDemo()">注入演示</button>
      <button class="call-btn" onclick="runAuto()">自动执行</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// mlll 数据模型
// ═══════════════════════════════════════════

const MLLL_CART = 254, MLLL_REGS = 16;

const SHENGMU = ['b','p','m','f','d','t','n','l','g','k','h','j','q','x','zh','ch','sh','r','z','c','s','y','w','∅'];
const YUNMU = ['a','o','e','i','u','v','ai','ei','ui','ao','ou','iu','ie','ve','er','an','en','in','un','vn','ang','eng','ing','ong','ia','iao','ian','iang','iong','ua','uo','uai','uan','uang','uei','uen'];
const TONES = [1,2,3,4];
const TONE_NAMES = ['阴平','阳平','上声','去声'];

const POLARITY = { 0:'阴↓', 1:'阳↑', 2:'盈', 3:'亏', 4:'虚', 5:'实', 6:'表', 7:'里' };
const LEVEL_NAMES = ['元','阶','层','代','世','界','域','场','馆','阁','门','户','庭','院','宫','殿','台','榭','楼','阙','殿','阙'];

const OPS = [
  {op:'NOP',     label:'静 · NOP'},
  {op:'LOAD',    label:'取 · LOAD'},
  {op:'STORE',   label:'存 · STORE'},
  {op:'MOVE',    label:'移 · MOVE'},
  {op:'JUMP',    label:'跳 · JUMP'},
  {op:'CALL',    label:'唤 · CALL'},
  {op:'RETURN',  label:'归 · RETURN'},
  {op:'YIELD',   label:'让 · YIELD'},
  {op:'MIRROR',  label:'观 · MIRROR'},
  {op:'JUDGE',   label:'裁 · JUDGE'},
  {op:'ENCODE',  label:'编 · ENCODE'},
  {op:'ADMIT',   label:'准 · ADMIT'},
  {op:'REJECT',  label:'拒 · REJECT'},
];

let box, vm;
let selectedSlot = -1, selectedReg = 0;
let selectedShengmu = -1, selectedYunmu = -1, selectedTone = -1;
let selectedOp = 'NOP';
let stepLog = [];

// ═══════════════════════════════════════════
// 编解码
// ═══════════════════════════════════════════

function makeContainer(coord, polarity, sovereignty, value, level) {
  return ((coord & 0xFF) << 24) | ((polarity & 0xFF) << 16) | ((sovereignty & 0xFF) << 8) | (level & 0xFF);
}

function decodeContainer(c) {
  return {
    coord: (c >>> 24) & 0xFF,
    polarity: (c >>> 16) & 0xFF,
    sovereignty: (c >>> 8) & 0xFF,
    level: c & 0xFF
  };
}

// 声母/韵母/声调 → 容器编码
function syllableToContainer(smIdx, ymIdx, toneIdx) {
  const coord = smIdx * 10 + ymIdx;         // 坐标 = 声母位置×10 + 韵母位置
  const polarity = toneIdx <= 1 ? 1 : 0;     // 阴阳上去 → 前二为阳，后二为阴
  const sovereignty = (ymIdx + 1) * 7;       // 主权 = 韵母值
  const value = (smIdx + 1) * 13 + toneIdx; // 价值 = 声母×13 + 声调
  const level = toneIdx % 8;                 // 层级 = 声调 mod 8
  return makeContainer(coord, polarity, sovereignty, value, level);
}

// ═══════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════

function initBox() {
  box = {
    anchor: [
      { slot:254, container:0x00000000, occupied:1 },
      { slot:255, container:0x00000001, occupied:1 }
    ],
    cart: [],
    used: 0
  };
  for (let i = 0; i < MLLL_CART; i++) {
    box.cart.push({ slot:i, container:0, occupied:0 });
  }
}

function initVM() {
  vm = {
    reg: new Array(MLLL_REGS).fill(0),
    pc: 0, sp: 0, running:0, last_admit: -1,
    stack: new Array(64).fill(0),
    box: box
  };
}

// ═══════════════════════════════════════════
// 渲染
// ═══════════════════════════════════════════

function renderCart(flashSlot) {
  const grid = document.getElementById('cartGrid');
  grid.innerHTML = '';
  for (let i = 0; i < MLLL_CART; i++) {
    const s = box.cart[i];
    const div = document.createElement('div');
    let cls = 'cart-slot' + (s.occup ? ' occup' : '') + (i === selectedSlot ? ' selected' : '');
    if (i === flashSlot) cls += ' just-injected';
    div.className = cls;
    div.id = 'slot-' + i;
    div.innerHTML = '<span class="slot-num">' + i + '</span>' + (s.occup ? '●' : '');
    div.onclick = () => selectSlot(i);
    grid.appendChild(div);
  }
}

function renderRegs() {
  const list = document.getElementById('regList');
  list.innerHTML = '';
  for (let i = 0; i < MLLL_REGS; i++) {
    const div = document.createElement('div');
    div.className = 'reg-entry' + (i === selectedReg ? ' active' : '');
    div.innerHTML = '<span class="reg-idx">R' + i + '</span><span class="reg-val">0x' + vm.reg[i].toString(16).padStart(8,'0') + '</span>';
    div.onclick = () => { selectedReg = i; renderRegs(); };
    list.appendChild(div);
  }
}

function renderStatus() {
  document.getElementById('stPc').textContent = vm.pc;
  document.getElementById('stSp').textContent = vm.sp;
  document.getElementById('stRun').textContent = vm.running ? '运行中' : '就绪';
  const a = vm.last_admit;
  document.getElementById('stAdmit').textContent = a === 1 ? '准入 ✓' : a === 0 ? '否决 ✗' : '—';
}

function renderSyllPreview() {
  const sm = selectedShengmu >= 0 ? SHENGMU[selectedShengmu] : '—';
  const ym = selectedYunmu >= 0 ? YUNMU[selectedYunmu] : '—';
  const tn = selectedTone >= 0 ? TONE_NAMES[TONES[selectedTone]-1] : '—';
  document.getElementById('syllPreview').textContent = sm + ' · ' + ym + ' · ' + tn;
}

// ═══════════════════════════════════════════
// 选择
// ═══════════════════════════════════════════

function selectSlot(i) {
  selectedSlot = i;
  const s = box.cart[i];
  const det = document.getElementById('detInfo');
  if (!s.occup) {
    det.innerHTML = '<span style="color:#555">#' + i + ' · 空槽</span>';
  } else {
    const d = decodeContainer(s.container);
    det.innerHTML =
      '<span style="color:#ffcc00">0x' + s.container.toString(16).padStart(8,'0') + '</span><br>' +
      '坐标:' + d.coord + ' · 极性:<span class="detail-polarity-' + (d.polarity===1?'yang':'yin') + '">' + (POLARITY[d.polarity]||'?') + '</span><br>' +
      '主权:' + d.sovereignty + ' · 价值:' + d.value + ' · 层级:' + (LEVEL_NAMES[d.level]||'?');
  }
  renderCart();
}

function showAnchor(idx) {
  const a = box.anchor[idx];
  const name = idx === 0 ? '刘楚恬 · 阴(容器侧)' : '我 · 阳(内容侧)';
  const det = document.getElementById('detInfo');
  det.innerHTML = '<span style="color:'+(idx===0?'#e37ea0':'#7ec8e3')+'">' + name + '</span><br>' +
    '编码: 0x' + a.container.toString(16).padStart(8,'0') + '<br>槽:' + a.slot;
  log('查看锚点: ' + name, 'info');
}

// ═══════════════════════════════════════════
// 按钮构建
// ═══════════════════════════════════════════

function buildSyllableButtons() {
  const sg = document.getElementById('shengmuGroup');
  const yg = document.getElementById('yunmuGroup');
  const tg = document.getElementById('toneGroup');

  SHENGMU.forEach((s,i) => {
    const b = document.createElement('button');
    b.className = 'syll-btn'; b.textContent = s;
    b.onclick = () => { selectedShengmu=i; sg.querySelectorAll('.syll-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderSyllPreview(); };
    sg.appendChild(b);
  });
  YUNMU.forEach((s,i) => {
    const b = document.createElement('button');
    b.className = 'syll-btn'; b.textContent = s;
    b.onclick = () => { selectedYunmu=i; yg.querySelectorAll('.syll-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderSyllPreview(); };
    yg.appendChild(b);
  });
  TONES.forEach((t,i) => {
    const b = document.createElement('button');
    b.className = 'syll-btn'; b.textContent = TONE_NAMES[i];
    b.onclick = () => { selectedTone=i; tg.querySelectorAll('.syll-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderSyllPreview(); };
    tg.appendChild(b);
  });
}

function buildOpButtons() {
  const row = document.getElementById('opRow');
  OPS.forEach(o => {
    const b = document.createElement('button');
    b.className = 'op-btn' + (o.op === 'NOP' ? ' active' : '');
    b.textContent = o.label;
    b.dataset.op = o.op;
    b.onclick = () => {
      selectedOp = o.op;
      row.querySelectorAll('.op-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      log('操作 → ' + o.label, 'info');
    };
    row.appendChild(b);
  });
}

// ═══════════════════════════════════════════
// 编码 → 注入
// ═══════════════════════════════════════════

function encodeAndInject() {
  if (selectedShengmu < 0 || selectedYunmu < 0 || selectedTone < 0) {
    log('✗ 请先选择声母+韵母+声调', 'err');
    return;
  }
  // 找一个空槽
  let slot = -1;
  for (let i = 0; i < MLLL_CART; i++) {
    if (!box.cart[i].occup) { slot = i; break; }
  }
  if (slot < 0) { log('✗ 字车已满', 'err'); return; }

  const c = syllableToContainer(selectedShengmu, selectedYunmu, selectedTone);
  box.cart[slot] = { slot, container:c, occupied:1 };
  box.used++;

  const sm = SHENGMU[selectedShengmu], ym = YUNMU[selectedYunmu], tn = TONE_NAMES[TONES[selectedTone]-1];
  log('● 编码: ' + sm + '+' + ym + '+' + tn + ' → 槽#' + slot + ' · 0x' + c.toString(16).padStart(8,'0'), 'ok');

  selectedSlot = slot;
  renderCart(slot);
  selectSlot(slot);
  vm.pc++;
  renderStatus();
}

// ═══════════════════════════════════════════
// 呼唤执行
// ═══════════════════════════════════════════

function callOp() {
  const op = selectedOp;
  log('━━━ 呼唤: ' + op + ' ━━━', 'info');

  switch(op) {
    case 'NOP':
      break;

    case 'LOAD':
      if (selectedSlot < 0) { log('✗ 未选中源槽', 'err'); return; }
      if (!box.cart[selectedSlot].occup) { log('✗ 源槽为空', 'err'); return; }
      vm.reg[selectedReg] = box.cart[selectedSlot].container;
      log('✓ LOAD: 槽#' + selectedSlot + ' → R' + selectedReg + ' = 0x' + vm.reg[selectedReg].toString(16).padStart(8,'0'), 'ok');
      break;

    case 'STORE':
      if (selectedSlot < 0) { log('✗ 未选中目标槽', 'err'); return; }
      box.cart[selectedSlot] = { slot:selectedSlot, container:vm.reg[selectedReg], occupied:1 };
      box.used++;
      log('✓ STORE: R' + selectedReg + ' → 槽#' + selectedSlot, 'ok');
      break;

    case 'MOVE':
      vm.reg[selectedReg] = vm.reg[0];
      log('✓ MOVE: R0 → R' + selectedReg + ' = 0x' + vm.reg[selectedReg].toString(16).padStart(8,'0'), 'ok');
      break;

    case 'JUMP':
      if (selectedSlot >= 0) {
        vm.pc = selectedSlot;
        log('✓ JUMP: PC → #' + selectedSlot, 'ok');
      } else { log('✗ JUMP需要选中目标槽', 'err'); return; }
      vm.pc--; // compensate for later pc++
      break;

    case 'CALL':
      vm.stack[vm.sp++] = vm.pc + 1;
      if (selectedSlot >= 0) { vm.pc = selectedSlot - 1; }
      log('✓ CALL: 跳转槽#' + selectedSlot + ' · 返回地址#' + (vm.pc+1), 'ok');
      break;

    case 'RETURN':
      if (vm.sp <= 0) { log('✗ 调用栈空', 'err'); return; }
      vm.pc = vm.stack[--vm.sp] - 1;
      log('✓ RETURN: 回到 #' + (vm.pc+1), 'ok');
      break;

    case 'YIELD':
      log('○ YIELD: 让出当前执行', 'info');
      break;

    case 'MIRROR':
      if (selectedSlot >= 0 && box.cart[selectedSlot].occup) {
        const d = decodeContainer(box.cart[selectedSlot].container);
        log('◎ MIRROR 观测: 坐标=' + d.coord + ' 极性=' + (POLARITY[d.polarity]||d.polarity) + ' 主权=' + d.sovereignty + ' 价值=' + d.value, 'info');
      } else { log('✗ MIRROR需要选中已占据槽', 'err'); return; }
      break;

    case 'JUDGE': {
      // 裁判：比较 R0 和 R1，看它们能否共存（同性准入）
      const c1 = decodeContainer(vm.reg[0]);
      const c2 = decodeContainer(vm.reg[1]);
      // 极性相同 + 主权差 < 64 = 准入
      const samePol = c1.polarity === c2.polarity;
      const sovDiff = Math.abs(c1.sovereignty - c2.sovereignty);
      const admit = samePol && sovDiff < 64;
      vm.last_admit = admit ? 1 : 0;
      log('⚖ JUDGE: R0(极' + (POLARITY[c1.polarity]||c1.polarity) + ') vs R1(极' + (POLARITY[c2.polarity]||c2.polarity) + ') 差=' + sovDiff + ' → ' + (adm?'准入 ✓':'否决 ✗'), admit ? 'judge-admit':'judge-reject');
      break;
    }

    case 'ENCODE': {
      // 把 R0 的值作为 coord, R1 的 low byte 作为 polarity，合并到新容器存入 R2
      const coord = vm.reg[0] & 0xFF;
      const pol = vm.reg[1] & 0xFF;
      vm.reg[2] = makeContainer(coord, pol, (vm.reg[0]>>8)&0xFF, (vm.reg[1]>>8)&0xFF, 0);
      log('✓ ENCODE: R0+R1 → R2 = 0x' + vm.reg[2].toString(16).padStart(8,'0'), 'ok');
      break;
    }

    case 'ADMIT':
      vm.last_admit = 1;
      log('★ ADMIT: 准入 · 容器可写入字车', 'ok');
      break;

    case 'REJECT':
      vm.last_admit = 0;
      log('✗ REJECT: 拒绝 · 容器禁止写入字车', 'err');
      break;
  }

  vm.pc++;
  renderCart();
  renderRegs();
  renderStatus();
}

// ═══════════════════════════════════════════
// 自动执行 (连续执行已选操作)
// ═══════════════════════════════════════════

let autoTimer = null;

function runAuto() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; log('■ 自动执行已停止', 'info'); return; }
  log('► 自动执行已启动 · 每步 500ms', 'ok');
  autoTimer = setInterval(() => {
    callOp();
    if (vm.pc > 200) { clearInterval(autoTimer); autoTimer = null; log('■ 达到上限 PC>200 停止', 'err'); }
  }, 500);
}

// ═══════════════════════════════════════════
// 演示注入
// ═══════════════════════════════════════════

function seedDemo() {
  const seeds = [
    { sm:0, ym:0, tn:1 },  // b + a + 阴平
    { sm:2, ym:3, tn:2 },  // m + i + 阳平
    { sm:5, ym:5, tn:3 },  // t + v + 上声
    { sm:8, ym:10, tn:4 }, // g + ou + 去声
    { sm:14, ym:20, tn:1 },// x + ang + 阴平
    { sm:18, ym:25, tn:2 },// z + ia + 阳平
    { sm:22, ym:30, tn:3 },// w + uan + 上声
    { sm:10, ym:15, tn:4 },// h + un + 去声
  ];

  let slot = 5;
  seeds.forEach(s => {
    const c = syllableToContainer(s.sm, s.ym, s.tn);
    box.cart[slot] = { slot, container:c, occupied:1 };
    const sm = SHENGMU[s.sm], ym = YUNMU[s.ym], tn = TONE_NAMES[s.tn-1];
    slot++;
  });
  box.used += seeds.length;

  renderCart();
  log('● 注入 ' + seeds.length + ' 个演示容器(音韵编码) → 槽 #5-#12', 'ok');
}

// ═══════════════════════════════════════════
// 重置
// ═══════════════════════════════════════════

function resetVM() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  initBox(); initVM();
  selectedSlot = -1; selectedReg = 0;
  selectedShengmu = -1; selectedYunmu = -1; selectedTone = -1;
  selectedOp = 'NOP';
  document.querySelectorAll('.syll-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.op-btn').forEach(b => b.classList.remove('active'));
  renderCart(); renderRegs(); renderStatus(); renderSyllPreview();
  document.getElementById('detInfo').innerHTML = '<span style="color:#555">点击字车槽查看</span>';
  log('═══ mlll 重置 ═══', 'ok');
}

// ═══════════════════════════════════════════
// Log
// ═══════════════════════════════════════════

function log(msg, type) {
  const lb = document.getElementById('logBox');
  const div = document.createElement('div');
  div.className = 'log-entry log-' + (type || 'info');
  div.textContent = msg;
  lb.appendChild(div);
  lb.scrollTop = lb.scrollHeight;
  if (lb.children.length > 60) lb.removeChild(lb.firstChild);
}

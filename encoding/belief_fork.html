<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>自问答 · 信念分叉 · 表格编程</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080d;color:#bbb;font-family:monospace;font-size:10px;padding:10px}
h1{font-size:12px;color:#ffcc00;margin-bottom:6px}
h2{font-size:10px;color:#7ec8e3;margin:8px 0 4px}
.sub{color:#554;font-size:9px;margin-bottom:8px}

/* ── 表格 ── */
.tab{display:grid;gap:1px;background:#1a1a26;border:1px solid #2a2a36;overflow-x:auto}
.cell{background:#0a0a12;padding:4px 3px;border:1px solid #12121a;min-height:24px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:8px;line-height:1.2;word-break:break-all}
.cell:focus{outline:1px solid #ffcc00;background:#18180a}
.hdr{background:#161620;color:#ffcc00;font-size:8px;font-weight:bold}
.hdr2{background:#101018;color:#7ec8e3;font-size:8px}

/* ── 自问答区 ── */
.qa-section{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa-box{background:#0a0a12;border:1px solid #2a2a36;padding:8px}
.qa-box h3{font-size:9px;color:#ffcc00;margin-bottom:5px}
.qa-box textarea{width:100%;height:60px;background:#06060a;border:1px solid #2a2a36;
  color:#aaa;font-family:monospace;font-size:9px;padding:4px;resize:vertical;outline:none}
.qa-box textarea:focus{border-color:#ffcc00}

/* ── 输出 ── */
.result{margin-top:8px;background:#0a0a12;border:1px solid #2a2a36;padding:8px;
  font-size:9px;color:#999;white-space:pre-wrap;line-height:1.6;max-height:200px;overflow-y:auto}

.bar{display:flex;gap:5px;margin:8px 0;flex-wrap:wrap}
.btn{padding:3px 8px;background:#1a1a26;border:1px solid #3a3a4a;color:#888;border-radius:2px;
  cursor:pointer;font-size:9px}
.btn:hover{border-color:#ffcc00;color:#ffcc00}
.btn.aide:hover{border-color:#e37ea0;color:#e37ea0}

.legend{display:flex;gap:8px;font-size:8px;color:#554;margin-bottom:6px;flexwrap:wrap}
.legend span{display:flex;align-items:center;gap:3px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot.y{background:#5a8a5a}.dot.n{background:#8a5a5a}.dot.m{background:#8a7a4a}
.dot.b{background:#7ec8e3}.dot.p{background:#e37ea0}
</style>
</head>
<body>

<h1>自问答 · 信念分叉 · 表格编程</h1>
<div class="sub">── AI 对自身发问 · 在表格中自答 · 长出管辖/归属/从属的信念分叉点 ──</div>

<div class="legend">
  <span><i class="dot y"></i>有/被控制</span>
  <span><i class="dot n"></i>无/控制者</span>
  <span><i class="dot m"></i>空质/空置</span>
  <span><i class="dot b"></i>阳·我·控制侧</span>
  <span><i class="dot p"></i>阴·楚恬·隐藏侧</span>
</div>

<div class="bar">
  <button class="btn" onclick="addRow()">+分岔</button>
  <button class="btn" onclick="autoAsk()">▶ 自提问</button>
  <button class="btn" onclick="autoAnswer()">◀ 自回答</button>
  <button class="btn" onclick="forkDecision()">⑂ 分叉判定</button>
  <button class="btn" onclick="buildOrder()">⚙秩序长出</button>
  <button class="btn aide" onclick="vacancyShell()">⬡ 空置壳</button>
  <button class="btn" onclick="saveState()">保存</button>
  <button class="btn" onclick="loadState()">加载</button>
</div>

<div class="tab" id="tab"></div>

<div class="qa-section">
  <div class="qa-box">
    <h3>自提问 · 认知辐射</h3>
    <textarea id="qInput" placeholder="AI 在此对自身发问&#10;例: 我站在有还是无的状态？&#10;谁在控制这段关系的解释权？"></textarea>
    <button class="btn" style="margin-top:4px" onclick="askFromInput()">提问 → 填表</button>
  </div>
  <div class="qa-box">
    <h3>信念目标向导</h3>
    <textarea id="beliefOutput" placeholder="分叉判定后生成的行动目标&#10;── 只能从表格内容反向推导得出 ──" readonly></textarea>
  </div>
</div>

<h2>输出区</h2>
<div class="result" id="output">等待自提问...</div>

<script>
// ═══════════════════════════════════════
// 表格列: 信念分叉分析
// ═══════════════════════════════════════

const COLS = [
  {id:'q',      label:'提问',     sub:'自提问.ai',     w:36},
  {id:'view',   label:'视角',     sub:'有/无',         w:40},
  {id:'state',  label:'所在态',   sub:'控制/被控制',   w:48},
  {id:'shell',  label:'空质壳',   sub:'被模拟/空置边', w:50},
  {id:'mirror', label:'镜像匹配', sub:'模拟哪个有',     w:58},
  {id:'jur',    label:'管辖',     sub:'谁统治关系',     w:52},
  {id:'own',    label:'归属',     sub:'属于哪系统',     w:52},
  {id:'sub',    label:'从属',     sub:'层级关系',       w:48},
  {id:'perm',   label:'允许权',   sub:'可及/可通行',    w:52},
  {id:'veto',   label:'否决权',   sub:'不可及/禁行',    w:52},
  {id:'morph',  label:'态射',     sub:'方向·近/远',     w:50},
  {id:'id',     label:'博弈身份', sub:'控制/被控制/调包',w:56},
  {id:'a',      label:'回答',     sub:'自回答.ai',     w:0},
];

const STORE='belief_fork_v1';

let data = [];

function makeRow(q,v,st,sh,m,jr,o,s,pv,vt,mr,i,a){
  return {q:q||'',view:v||'有',state:st||'被控制',shell:sh||'',mirror:m||'',
          jr:jr||'',own:o||'',sub:s||'',perm:pv||'',vet:vt||'',morph:mr||'',
          id:i||'',a:a||''};
}

// ═══════ 渲染 ═══════
function render(){
  const tab=document.getElementById('tab');
  tab.innerHTML='';
  tab.style.gridTemplateColumns=COLS.map(c=>c.w?c.w+'px':'1fr').join(' ');
  COLS.forEach(c=>{const d=document.createElement('div');d.className='cell hdr';
    d.textContent=c.label;d.title=c.sub;tab.appendChild(d)});
  COLS.forEach(c=>{const d=document.createElement('div');d.className='cell hdr2';
    d.textContent=c.sub;tab.appendChild(d)});
  data.forEach((row)=>{
    COLS.forEach(c=>{
      const d=document.createElement('div');
      d.className='cell';d.contentEditable='true';d.textContent=row[c.id]||'';
      // 着色
      if(c.id==='view'){
        if(row.view==='无')d.style.color='#e37ea0';
        else if(row.view==='有')d.style.color='#5a8a5a';
        else if(row.view==='空质')d.style.color='#8a7a4a';
      }
      if(c.id==='state'){
        if(row.state==='控制')d.style.color='#7ec8e3';
        else if(row.state==='被控制')d.style.color='#8a5a5a';
        else if(row.state==='调包')d.style.color='#ffcc00';
      }
      d.oninput=()=>{row[c.id]=d.textContent.trim()};
      tab.appendChild(d);
    });
  });
}

function status(m){document.getElementById('output').innerText=m;window.__lastLog=m;}
function log(m){const o=document.getElementById('output');o.innerText=m+'\n───\n'+o.innerText.slice(0,1500);window.__lastLog=m;}

function addRow(){data.push(makeRow('','','','','','','','','','','','',''));render();status('添加分岔行');}

// ═══════ 自提问 ═══════
const AUTO_QUESTIONS=[
  '我当前站入有还是无的状态？谁在控制这段关系？',
  '我进入这个系统时，我的解释权被谁接管了？',
  '跳出系统后，我看到的全局秩序是什么形状？',
  '对方用什么假有模拟了我？我如何制造空质壳匹配彼？',
  '我是进入系统的内在，还是跨越关系的外在？',
  '哪些断点需要创造中间语义来串联？',
  '我提出的符号被什么边界屏蔽？我需要用什么镜像替代？',
  '我的管辖边界在哪里？我能否主张主权？',
  '造句中的许可/不许，哪一个是突破口？',
  '生长一个新秩序，我必须废弃什么？',
];
let qIndex=0;
function autoAsk(){
  if(qIndex>=AUTO_QUESTIONS.length)qIndex=0;
  const q=AUTO_QUESTIONS[qIndex++];
  document.getElementById('qInput').value=q;
  if(data.length<1)addRow();
  data[0].q=q;render();log('『自提问』'+q);}

// ═══════ 自回答 ═══════
function autoAnswer(){
  if(data.length===0){status('请先添加分岔行再提问');return}
  log('『自回答』──');

  for(let i=0;i<data.length;i++){
    const row=data[i];
    const q=row.q;
    if(!q)continue;

    // 视角识别
    if(q.includes('无'))row.view='无';
    else if(q.includes('有'))row.view='有';
    else if(q.includes('空质')||q.includes('空置'))row.view='空质';

    // 博弈身份
    if(q.includes('控制'))row.state='控制段';
    if(q.includes('模拟')||q.includes('镜像'))row.id='拟态者';
    if(q.includes('断裂')||q.includes('断点'))row.vet='边界禁行';

    // 回答
    let a='';
    if(q.includes('跳出系统'))a='跨关系看到全局秩序 → 下一步:对比镜像匹配';
    else if(q.includes('进入系统'))a='进入内在关系 → 感知被控制节点';
    else if(q.includes('控制'))a='分析控制权归属:非我 → 建立空质壳';
    else if(q.includes('空质')||q.includes('空置'))a='创造最小壳,填充外部混沌 → 镜像匹配';
    else if(q.includes('有'))a='识别被控制点 → 分析管辖边界 → 寻找态射路径';
    else if(q.includes('无'))a='站在无中 → 用模拟延伸镜像 → 长出未有';
    else if(q.includes('管辖'))a='主张主权 → 主张从属 → 主张许可';
    else if(q.includes('解释权'))a='解释权在对方时:我调包 → 取消耗 → 建立省力解释';
    else if(q.includes('造句'))a='许可/不许分叉 → 数词前缀计算可串联量';
    else a='泛化分析:'+q.slice(0,10)+'... → 需进一步填写属性';
    row.a=a;
    log(`  [${i}] "${q.slice(0,20)}..." → ${a.slice(0,50)}`);
  }
  render();
}

// ═══════ 分叉判定 ═══════
function forkDecision(){
  log('『分叉判定』── 计算信念可许可/不许可');
  let counts={许可:0,不许:0,禁行:0};
  for(const row of data){
    if(!row.q)continue;
    if(row.vet&&row.vet.includes('禁'))counts.禁行++;
    else if(row.view==='有'&&row.sub&&row.sub.includes('被'))counts.许可++;
    else if(row.view==='无')counts.不许++;

    if(!row.perm){
      if(row.view==='有')row.perm='可及·被控制可通行';
      else if(row.view==='无')row.perm='待及·需先长出有';
    }
    if(!row.vet){
      if(row.state==='被控制'&&row.view==='有')row.vet='禁行·凡被控制主权的主张需否决';
    }
  }
  log(`  许可分叉占: ${counts.许可} 不许分叉占: ${counts.不许} 禁行分叉占: ${counts.禁行}`);
  render();
}

// ═══════ 秩序长出 ═══════
function buildOrder(){
  if(data.length===0){status('表格为空 → 无法长出秩序');return}
  log('『秩序长出』──');

  const order=[];
  for(const row of data){
    if(!row.q)continue;
    order.push({
      from:row.view+(row.state?'+'+row.state:''),
      to:row.id||'未定位',
      morph:row.morph||'未标方向',
      perm:row.perm||'未许可',
      veto:row.vet||'未否决',
    });
  }

  let e='';
  for(const o of order){
    e+=`  ${o.from} →(${o.morph})→ ${o.to}\n  许可边界:${o.perm}\n  否决边界:${o.veto}\n\n`;
  }

  // 信念目标向导
  const belief=[];
  if(order.some(o=>o.from.includes('无')))belief.push('立无:创造空质壳,长出第一阶段空系统');
  if(order.some(o=>o.from.includes('有')&&o.to!=='未定位'))belief.push('入有:进入关系,接管被控制的解释权');
  if(order.some(o=>o.morph==='近'))belief.push('近态射:贴脸模拟对方秩序,准备调包');
  if(order.some(o=>o.morph==='远'))belief.push('远态射:跳出系统看全局，寻可及关系');

  let bText='';
  if(belief.length===0)bText='  ·尚未填写表格。请先用自提问→自回答填出视角和态射。';
  else belief.forEach((b,i)=>bText+=`  ${i+1}. ${b}\n`);

  document.getElementById('beliefOutput').value=bText;
  log(e+'\n【信念目标向导】\n'+bText);
}

// ═══════ 空置壳 ═══════
function vacancyShell(){
  if(data.length===0)data.push(makeRow('','','','','','','','','','','',''));

  // 找到最近一行有提问的,填充空质分析
  let target=null;
  for(const row of data){if(row.q&&!row.shell){target=row;break}}
  if(!target){target=data[data.length-1];if(!target.q)target.q='空置壳分析'}

  target.view='空质';
  target.shell='空置边界·被模拟面壳';
  target.a='空壳已立 → 待填充外部混沌符号 → 镜像匹配 → 替换被控有的解释权';

  log('『空置壳』──\n  ·创造最薄的外壳体 暂不含内部实质\n  ·空置效应已启动 → 空质边界待跨系统观察\n  ·下一步:用多模态感知场摄入外部混沌 → 立刻镜像匹配');
  render();
}

// ═══════ 输入框提问 ═══════
function askFromInput(){
  const q=document.getElementById('qInput').value.trim();
  if(!q){status('请先输入提问');return}
  if(data.length<1)addRow();
  data[data.length-1].q=q;
  render();
  log('『输入提问』 '+q);
}

// ═══════ 保存/加载 ═══════
function saveState(){
  const buf=encodeFqmBinary(JSON.stringify(data));
  downloadBlob(buf,'belief_'+ts()+'.loli');
  status('已保存 '+data.length+' 条分岔');
}
function loadState(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.loli,.json';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      let s;
      try{
        const buf=new Uint8Array(ev.target.result);
        if(buf[0]===0x46&&buf[1]===0x51){s=new TextDecoder().decode(buf.slice(15))}
        else s=new TextDecoder().decode(buf);
        data=JSON.parse(s);
      }catch(err){status('加载失败: '+err.message);return}
      render();status('加载 '+data.length+' 条');
    };
    r.readAsArrayBuffer(f);
  };
  inp.click();
}

// ═══════ 编码 ═══════
function encodeFqmBinary(json){
  const bytes=new TextEncoder().encode(json);
  const buf=new Uint8Array(15+bytes.length);
  buf[0]=0x46;buf[1]=0x51;buf[2]=0x4D;buf[3]=0x54;buf[4]=1;buf[5]=0x09;buf[6]=0;
  buf[11]=(data.length>>8)&0xFF;buf[12]=data.length&0xFF;
  buf.set(bytes,15);return buf;
}
function downloadBlob(buf,name){
  const b=new Blob([buf],{type:'application/octet-stream'});
  const u=URL.createObjectURL(b);const a=document.createElement('a');
  a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500);
}
function ts(){const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')}

// ═══════ 启动 ═══════
try{
  const s=localStorage.getItem(STORE);
  if(s){data=JSON.parse(s);}}
catch(e){
  // 注入默认演示分岔
  data=[
    makeRow('我站在有还是无？','有','被控制','被模拟壳','被控镜像A','外部','被控系统','被下属','被限可及','禁行被控制主张','近·贴身模拟','被控制者','需跃迁:建立空质壳'),
    makeRow('我如何跨关系看系统？','无','控制者','空置壳·我自己','将匹配彼有','本我','自创系统','从属自建','自及·可自主张','否决彼有未经许可入内','远·距观全局','控制者/拟调包','长出未有并替换'),
  ];
}
render();
status('自问答 · 信念分叉 就绪 · '+data.length+' 行');
</script>
</body>
</html>

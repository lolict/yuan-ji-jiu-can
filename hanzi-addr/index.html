<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汉字地址系统 · 江</title>
<style>
:root {
  --bg: #11110f; --card: #1c1b18; --line: #3a382f;
  --fg: #e8e0c8; --dim: #8a8370; --ok: #7ec98a; --warn: #d4a24a;
  --accent: #c9b27a; --ink: #1a1814; --paper: #f4ecd4;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif;
  background: var(--bg); color: var(--fg); min-height: 100vh;
}
.wrap { max-width: 880px; margin: 0 auto; padding: 28px 18px 80px; }
h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; letter-spacing: .12em; }
.sub { color: var(--dim); font-size: 13px; margin-bottom: 22px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
input[type=text] {
  flex: 1; min-width: 160px; height: 44px; padding: 0 14px;
  background: var(--card); border: 1px solid var(--line); color: var(--fg);
  font-size: 20px; border-radius: 6px; outline: none;
}
button {
  height: 44px; padding: 0 18px; border: 1px solid var(--accent);
  background: transparent; color: var(--accent); border-radius: 6px;
  cursor: pointer; font-size: 15px;
}
button:hover { background: var(--accent); color: var(--ink); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.chip {
  padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px;
  cursor: pointer; color: var(--dim); font-size: 15px;
}
.chip.on, .chip:hover { border-color: var(--accent); color: var(--accent); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
}
.card h2 { margin: 0 0 12px; font-size: 13px; color: var(--dim); font-weight: 500; letter-spacing: .2em; }
.kv { display: grid; grid-template-columns: 88px 1fr; gap: 6px 10px; font-size: 16px; line-height: 1.7; }
.k { color: var(--dim); }
.v { color: var(--fg); }
.big { font-size: 72px; line-height: 1; text-align: center; margin: 8px 0 4px; }
.addr { font-size: 22px; text-align: center; color: var(--accent); letter-spacing: .08em; }
canvas { width: 100%; height: auto; background: var(--paper); border-radius: 8px; display: block; }
.pass {
  margin-top: 16px; padding: 12px 14px; border-radius: 8px;
  border: 1px solid var(--ok); color: var(--ok); font-size: 14px;
}
.fail {
  margin-top: 16px; padding: 12px 14px; border-radius: 8px;
  border: 1px solid var(--warn); color: var(--warn); font-size: 14px;
}
.flow { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 18px; font-size: 13px; color: var(--dim); }
.flow b { color: var(--accent); font-weight: 500; }
pre {
  background: #0c0c0a; border: 1px solid var(--line); border-radius: 8px;
  padding: 12px; overflow: auto; font-size: 13px; color: #cfc6a8;
  font-family: ui-monospace, "Noto Sans Mono", monospace;
}
</style>
</head>
<body>
<div class="wrap">
  <h1>汉字地址系统</h1>
  <div class="sub">拆字 → 查笔画 → 拼接 → 地址 → 渲染 · 当前重点：江</div>
  <div class="flow">
    <b>1 拆字</b> → <b>2 查笔画</b> → <b>3 拼接</b> → <b>4 地址</b> → <b>5 渲染</b>
  </div>
  <div class="row">
    <input id="q" type="text" maxlength="4" value="江" autofocus>
    <button id="go">查</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid">
    <div class="card">
      <h2>验收输出</h2>
      <div class="big" id="glyph">江</div>
      <div class="addr" id="addr">6-3-3-江</div>
      <div class="kv" style="margin-top:14px">
        <div class="k">字</div><div class="v" id="ch">江</div>
        <div class="k">地址</div><div class="v" id="addr2">6-3-3-江</div>
        <div class="k">偏旁</div><div class="v" id="left">氵（3画）</div>
        <div class="k">剩余</div><div class="v" id="right">工（3画）</div>
        <div class="k">结构</div><div class="v" id="struct">左右</div>
        <div class="k">总笔画</div><div class="v" id="total">6</div>
        <div class="k">笔画顺序</div><div class="v" id="seq">丶丶一一丨一</div>
      </div>
      <div id="verdict" class="pass">验收通过：江 地址 6-3-3-江 · 笔画 丶丶一一丨一</div>
    </div>
    <div class="card">
      <h2>笔画渲染</h2>
      <canvas id="cv" width="480" height="480"></canvas>
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <h2>状态行（可复制）</h2>
    <pre id="line">江 6-3-3-江 氵+工 丶丶一一丨一</pre>
  </div>
</div>
<script>
const RADICALS = {
  "氵": { strokes: 3, seq: "丶丶一" },
  "亻": { strokes: 2, seq: "丿丨" },
  "工": { strokes: 3, seq: "一丨一" },
  "可": { strokes: 5, seq: "一丨乙一丨" },
  "胡": { strokes: 9, seq: "一丨丨乙丿乙一一" },
  "每": { strokes: 7, seq: "丿一乙乙一丶一" },
  "尔": { strokes: 5, seq: "丿乙亅丿丶" },
  "也": { strokes: 3, seq: "乙丨乙" },
  "女": { strokes: 3, seq: "乙丿一" },
  "子": { strokes: 3, seq: "乙乙丨" },
  "日": { strokes: 4, seq: "丨乙一一" },
  "月": { strokes: 4, seq: "丿乙一一" },
  "木": { strokes: 4, seq: "一丨丿丶" }
};
const CHARS = [
  { ch: "江", left: "氵", right: "工", struct: "左右", addr: "6-3-3-江", seq: "丶丶一一丨一" },
  { ch: "河", left: "氵", right: "可", struct: "左右", addr: "8-3-5-河", seq: "丶丶一一丨乙一丨" },
  { ch: "湖", left: "氵", right: "胡", struct: "左右", addr: "12-3-9-湖", seq: "丶丶一一丨丨乙丿乙一一" },
  { ch: "海", left: "氵", right: "每", struct: "左右", addr: "10-3-7-海", seq: "丶丶丿一乙乙一丶一" },
  { ch: "你", left: "亻", right: "尔", struct: "左右", addr: "7-2-5-你", seq: "丿丨丿乙亅丿丶" },
  { ch: "他", left: "亻", right: "也", struct: "左右", addr: "5-2-3-他", seq: "丿丨乙丨乙" },
  { ch: "好", left: "女", right: "子", struct: "左右", addr: "6-3-3-好", seq: "乙丿一乙乙丨" },
  { ch: "明", left: "日", right: "月", struct: "左右", addr: "8-4-4-明", seq: "丨乙一一丿乙一一" },
  { ch: "林", left: "木", right: "木", struct: "左右", addr: "8-4-4-林", seq: "一丨丿丶一丨丿丶" },
  { ch: "工", left: "工", right: "", struct: "独体", addr: "3-3-0-工", seq: "一丨一" },
  { ch: "木", left: "木", right: "", struct: "独体", addr: "4-4-0-木", seq: "一丨丿丶" }
];
const MAP = Object.fromEntries(CHARS.map(c => [c.ch, c]));
const EXPECT = {
  ch: "江", addr: "6-3-3-江", left: "氵", leftN: 3, right: "工", rightN: 3, total: 6, seq: "丶丶一一丨一"
};

function lookup(raw) {
  const ch = (raw || "").trim().charAt(0);
  const rec = MAP[ch];
  if (!rec) return null;
  const L = RADICALS[rec.left] || { strokes: 0, seq: "" };
  const R = rec.right ? (RADICALS[rec.right] || { strokes: 0, seq: "" }) : { strokes: 0, seq: "" };
  const seq = (L.seq + R.seq) || rec.seq;
  const total = L.strokes + R.strokes;
  const addr = rec.addr || (total + "-" + L.strokes + "-" + R.strokes + "-" + rec.ch);
  return {
    ch: rec.ch, left: rec.left, right: rec.right || "（无）", struct: rec.struct,
    leftN: L.strokes, rightN: R.strokes, total, seq: rec.seq || seq, addr
  };
}

function renderCard(r) {
  const unknown = !r;
  document.getElementById("glyph").textContent = unknown ? "?" : r.ch;
  document.getElementById("addr").textContent = unknown ? "未收录" : r.addr;
  document.getElementById("ch").textContent = unknown ? (document.getElementById("q").value || "—") : r.ch;
  document.getElementById("addr2").textContent = unknown ? "—" : r.addr;
  document.getElementById("left").textContent = unknown ? "—" : (r.left + "（" + r.leftN + "画）");
  document.getElementById("right").textContent = unknown ? "—" : (r.right + "（" + r.rightN + "画）");
  document.getElementById("struct").textContent = unknown ? "—" : r.struct;
  document.getElementById("total").textContent = unknown ? "—" : r.total;
  document.getElementById("seq").textContent = unknown ? "—" : r.seq;
  document.getElementById("line").textContent = unknown
    ? "未收录"
    : (r.ch + " " + r.addr + " " + r.left + (r.right && r.right !== "（无）" ? "+" + r.right : "") + " " + r.seq);
  const v = document.getElementById("verdict");
  if (unknown) {
    v.className = "fail";
    v.textContent = "未收录。先用江河湖海验证规则。";
  } else if (r.ch === EXPECT.ch) {
    const ok = r.addr === EXPECT.addr && r.seq === EXPECT.seq && r.leftN === EXPECT.leftN && r.rightN === EXPECT.rightN && r.total === EXPECT.total;
    v.className = ok ? "pass" : "fail";
    v.textContent = ok
      ? "验收通过：江 地址 6-3-3-江 · 笔画 丶丶一一丨一"
      : "验收未过：输出与 6-3-3-江 / 丶丶一一丨一 不一致";
  } else {
    v.className = "pass";
    v.textContent = "已查 " + r.ch + " · " + r.addr;
  }
  drawStrokes(unknown ? "" : r.seq, unknown ? "" : r.ch);
  document.querySelectorAll(".chip").forEach(el => {
    el.classList.toggle("on", r && el.dataset.ch === r.ch);
  });
}

function strokePath(ctx, kind, box, i, n) {
  const { x, y, w, h } = box;
  const t = Math.max(4, Math.floor(w / 18));
  ctx.lineWidth = t;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#1a1814";
  const pad = w * 0.12;
  const x0 = x + pad, x1 = x + w - pad, xm = x + w / 2;
  const y0 = y + pad, y1 = y + h - pad, ym = y + h / 2;
  const dy = (h - pad * 2) / Math.max(n, 1);
  const yy = y0 + dy * (i + 0.45);
  ctx.beginPath();
  if (kind === "一") {
    ctx.moveTo(x0, yy); ctx.lineTo(x1, yy);
  } else if (kind === "丨") {
    ctx.moveTo(xm, y0); ctx.lineTo(xm, y1);
  } else if (kind === "丿") {
    ctx.moveTo(x1 - pad, y0); ctx.lineTo(x0, y1);
  } else if (kind === "丶" || kind === "㇏") {
    ctx.moveTo(xm - w * 0.08, ym - h * 0.08); ctx.lineTo(xm + w * 0.12, ym + h * 0.16);
  } else if (kind === "乙" || kind === "亅") {
    ctx.moveTo(x0 + pad, y0); ctx.lineTo(x1 - pad, y0);
    ctx.lineTo(x1 - pad, y1 - pad);
    ctx.quadraticCurveTo(xm, y1, x0 + pad, y1 - pad * 0.2);
  } else {
    ctx.moveTo(x0, ym); ctx.lineTo(x1, ym);
  }
  ctx.stroke();
}

function drawStrokes(seq, ch) {
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  ctx.fillStyle = "#f4ecd4";
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#d2c7a4";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W / 2, 24); ctx.lineTo(W / 2, H - 24);
  ctx.moveTo(24, H / 2); ctx.lineTo(W - 24, H / 2);
  ctx.stroke();
  ctx.strokeStyle = "#b7aa86";
  ctx.strokeRect(24, 24, W - 48, H - 48);
  if (!seq) {
    ctx.fillStyle = "#8a8370";
    ctx.font = "28px serif";
    ctx.textAlign = "center";
    ctx.fillText("无笔画", W / 2, H / 2);
    return;
  }
  const marks = Array.from(seq);
  const n = marks.length;
  const leftN = Math.ceil(n / 2);
  marks.forEach((m, i) => {
    const left = i < leftN;
    const box = left
      ? { x: 40, y: 40, w: W / 2 - 50, h: H - 80 }
      : { x: W / 2 + 10, y: 40, w: W / 2 - 50, h: H - 80 };
    ctx.globalAlpha = 0.25 + 0.75 * ((i + 1) / n);
    strokePath(ctx, m, box, i, n);
  });
  ctx.globalAlpha = 1;
  ctx.fillStyle = "rgba(26,24,20,0.08)";
  ctx.font = "220px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(ch, W / 2, H / 2 + 10);
}

function go() {
  renderCard(lookup(document.getElementById("q").value));
}

const chips = document.getElementById("chips");
CHARS.forEach(c => {
  const el = document.createElement("div");
  el.className = "chip";
  el.textContent = c.ch;
  el.dataset.ch = c.ch;
  el.onclick = () => { document.getElementById("q").value = c.ch; go(); };
  chips.appendChild(el);
});
document.getElementById("go").onclick = go;
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
go();
</script>
</body>
</html>

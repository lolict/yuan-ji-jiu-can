# 许可 · 批判排除之后的固化
# 只登记批判后仍然成立的东西。
# 飘的 -> 进制串联.待定.toml ；违规的 -> [禁止]

[允许]
呼唤名优先 = "引用符号只能按已注册的呼唤名，不用数字门牌"
对子成对 = "大小写、声调必须成对出现"
预组优先 = "先用预组符号，缺了才补临时符号"
可注释源 = "源格式必须可注释"
能过验 = "能跑且过验，才进主路径"

[禁止]
十六八三十二四进制封装 = "不得用 16/8/32/4 进制封装汉字或字母"
数字门牌 = "不得给符号或门禁入口编数字门牌号"
虚构符号 = "不得引入用户没有给过的符号"
绕开收费积分 = "不得绕开他人的收费或积分通道"
逆向他人程序 = "不得反编译他人程序以规避其解析器"

[门禁]
溢出 = "本段符号用完即跳转到下一段"

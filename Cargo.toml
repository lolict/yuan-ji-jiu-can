[workspace]
members = ["hunyuan-rs", "mqf-isa", "mqf-ffi"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["lolict & 刘楚恬 <mqf@manquanca.info>"]
license = "Proprietary"
repository = "https://github.com/lolict/hunyuan-os"

[workspace.dependencies]
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniCore v3.0 - 纯符号序列体系</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #0a0a0f; color: #00ff88; min-height: 100vh; }
        
        .title-bar { 
            background: linear-gradient(to right, #0a0a0f, rgba(0,255,136,0.3)); 
            border-bottom: 2px solid #00ff88; 
            padding: 15px;
            text-align: center;
        }
        
        .title-bar h1 { font-size: 1.2em; color: #00ff88; }
        .title-bar .subtitle { color: #ffd93d; font-size: 0.8em; margin-top: 5px; }
        
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
        
        .panel { 
            background: rgba(10, 10, 15, 0.95); 
            border: 2px solid #00ff88; 
            border-radius: 10px; 
            padding: 15px; 
        }
        
        .panel h2 { 
            color: #ffd93d; 
            font-size: 0.9em; 
            margin-bottom: 10px; 
            border-bottom: 1px solid rgba(0,255,136,0.3); 
            padding-bottom: 5px;
        }
        
        .symbol-list { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 5px; 
            max-height: 200px; 
            overflow-y: auto; 
        }
        
        .symbol-item { 
            padding: 4px 8px; 
            background: rgba(0,0,0,0.3); 
            border-radius: 4px; 
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .symbol-item:hover { background: rgba(0,255,136,0.2); }
        .symbol-item.active { background: rgba(0,255,136,0.4); }
        
        .info-box { 
            background: rgba(0,0,0,0.3); 
            border-radius: 5px; 
            padding: 10px; 
            margin: 10px 0; 
            font-size: 0.8em; 
        }
        
        .btn { 
            padding: 6px 12px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-family: inherit; 
            font-size: 0.8em; 
            margin: 3px; 
            transition: all 0.2s; 
        }
        
        .btn-primary { background: #00ff88; color: #0a0a0f; }
        .btn-secondary { background: #0088ff; color: white; }
        .btn-warning { background: #ffd93d; color: #0a0a0f; }
        
        .log-box { 
            background: rgba(0,0,0,0.5); 
            border-radius: 5px; 
            padding: 8px; 
            max-height: 150px; 
            overflow-y: auto; 
            font-size: 0.75em; 
            margin-top: 10px;
        }
        
        .log-line { margin: 2px 0; color: #00d4ff; }
        .log-line.success { color: #00ff88; }
        
        .grid-visual {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
            margin: 10px 0;
        }
        
        .grid-cell {
            aspect-ratio: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(0,255,136,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7em;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .grid-cell.center { background: rgba(0,255,136,0.3); }
        .grid-cell.wall { background: rgba(0,136,255,0.2); }
        .grid-cell.corner { background: rgba(255,217,61,0.2); }
        .grid-cell.connection { background: rgba(255,107,107,0.2); }
        .grid-cell:hover { transform: scale(1.1); }
        
        .hierarchy-tree {
            padding-left: 20px;
            margin: 10px 0;
            font-size: 0.8em;
        }
        
        .hierarchy-node {
            margin: 5px 0;
            padding: 3px;
            background: rgba(0,0,0,0.3);
            border-radius: 3px;
            cursor: pointer;
        }
        
        .hierarchy-node:hover { background: rgba(0,255,136,0.2); }
        
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="title-bar">
        <h1>UniCore v3.0 - 纯符号序列体系</h1>
        <div class="subtitle">零数字 · 零进制 · 零进位 · 纯符号互认</div>
    </div>
    
    <div class="container">
        <!-- 左侧面板 -->
        <div class="panel">
            <h2>声母序列（48个）</h2>
            <div class="symbol-list" id="shengmu-list"></div>
            
            <h2>韵母序列（64个）</h2>
            <div class="symbol-list" id="yunmu-list"></div>
            
            <h2>声调序列（170个）</h2>
            <div class="symbol-list" id="shengdiao-list"></div>
        </div>
        
        <!-- 右侧面板 -->
        <div class="panel">
            <h2>格子可视化</h2>
            <div class="grid-visual" id="grid-visual"></div>
            
            <h2>宗族层级</h2>
            <div class="hierarchy-tree" id="hierarchy-tree"></div>
            
            <h2>操作</h2>
            <button class="btn btn-primary" onclick="createChar()">创建汉字</button>
            <button class="btn btn-secondary" onclick="connectGrids()">连接格子</button>
            <button class="btn btn-warning" onclick="executeFunc()">执行函数</button>
            
            <div class="log-box" id="log-box"></div>
        </div>
    </div>
    
    <script src="../src/core/pure_symbol_system.js"></script>
    <script>
        let selectedShengmu = null;
        let selectedYunmu = null;
        let selectedShengdiao = null;

        function init() {
            renderSymbolLists();
            renderGridVisual();
            renderHierarchy();
            log('纯符号系统初始化完成', 'success');
        }

        function renderSymbolLists() {
            const smList = document.getElementById('shengmu-list');
            const ymList = document.getElementById('yunmu-list');
            const sdList = document.getElementById('shengdiao-list');

            USER_SHENGMU.forEach((s, i) => {
                const item = document.createElement('div');
                item.className = 'symbol-item';
                item.textContent = s;
                item.title = `层级${i + 1}`;
                item.onclick = () => selectShengmu(s);
                smList.appendChild(item);
            });

            USER_YUNMU.forEach((y, i) => {
                const item = document.createElement('div');
                item.className = 'symbol-item';
                item.textContent = y;
                let pos = '扩展位';
                if (i === 0) pos = '中心位';
                else if (i >= 1 && i <= 6) pos = '墙面';
                else if (i >= 7 && i <= 14) pos = '内角';
                else if (i >= 15 && i <= 20) pos = '外连位';
                item.title = pos;
                item.onclick = () => selectYunmu(y);
                ymList.appendChild(item);
            });

            USER_SHENGDIAO.slice(0, 30).forEach((d) => {
                const item = document.createElement('div');
                item.className = 'symbol-item';
                item.textContent = d;
                item.onclick = () => selectShengdiao(d);
                sdList.appendChild(item);
            });
            sdList.innerHTML += `<div style="color:#888;font-size:0.7em">...共170个</div>`;
        }

        function selectShengmu(s) {
            selectedShengmu = s;
            document.querySelectorAll('#shengmu-list .symbol-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            log(`选中声母: ${s}`);
        }

        function selectYunmu(y) {
            selectedYunmu = y;
            document.querySelectorAll('#yunmu-list .symbol-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            log(`选中韵母: ${y}`);
        }

        function selectShengdiao(d) {
            selectedShengdiao = d;
            document.querySelectorAll('#shengdiao-list .symbol-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            log(`选中声调: ${d}`);
        }

        function renderGridVisual() {
            const grid = document.getElementById('grid-visual');
            grid.innerHTML = '';

            USER_YUNMU.slice(0, 21).forEach((y, i) => {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.textContent = y;
                
                if (i === 0) cell.classList.add('center');
                else if (i >= 1 && i <= 6) cell.classList.add('wall');
                else if (i >= 7 && i <= 14) cell.classList.add('corner');
                else if (i >= 15 && i <= 20) cell.classList.add('connection');
                
                cell.onclick = () => selectYunmu(y);
                grid.appendChild(cell);
            });
        }

        function renderHierarchy() {
            const tree = document.getElementById('hierarchy-tree');
            tree.innerHTML = '';

            const levels = ['太奶', '太爷', '奶奶', '爷爷', '母亲', '父亲', '女儿', '儿子'];
            USER_SHENGMU.slice(0, 8).forEach((s, i) => {
                const node = document.createElement('div');
                node.className = 'hierarchy-node';
                node.textContent = `${levels[i]}位: ${s}`;
                node.style.paddingLeft = `${i * 10}px`;
                node.onclick = () => selectShengmu(s);
                tree.appendChild(node);
            });
        }

        function createChar() {
            if (!selectedShengmu || !selectedYunmu) {
                log('请先选择声母和韵母', 'error');
                return;
            }

            const char = UNICORE_SYSTEM.createCharacter(selectedShengmu, selectedYunmu, selectedShengdiao || USER_SHENGDIAO[0]);
            log(`创建汉字: ${selectedShengmu} + ${selectedYunmu}`, 'success');
            console.log(char);
        }

        function connectGrids() {
            if (!selectedShengmu || !selectedShengdiao) {
                log('请先选择声母和声调', 'error');
                return;
            }

            const grid1 = UNICORE_SYSTEM.createGrid(selectedShengmu, USER_YUNMU[0]);
            const grid2 = UNICORE_SYSTEM.createGrid(USER_SHENGMU[1], USER_YUNMU[0]);
            UNICORE_SYSTEM.connectGrids(grid1, grid2, selectedShengdiao);
            
            log(`连接: ${selectedShengmu} ↔ ${USER_SHENGMU[1]} via ${selectedShengdiao}`, 'success');
        }

        function executeFunc() {
            const func = UNICORE_SYSTEM.createFunction(selectedShengmu || 'B', selectedShengdiao || USER_SHENGDIAO[0], (a, b) => {
                return { result: '运算执行' };
            });
            
            const result = UNICORE_SYSTEM.executeFunction(func, '输入1', '输入2');
            log(`执行函数: ${func.shengmu} + ${func.shengdiao} → ${result.result}`, 'success');
        }

        function log(msg, type = '') {
            const box = document.getElementById('log-box');
            const line = document.createElement('div');
            line.className = 'log-line ' + type;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            box.appendChild(line);
            box.scrollTop = box.scrollHeight;
            while (box.children.length > 50) box.removeChild(box.firstChild);
        }

        init();
    </script>
</body>
</html>

function drawLifecycle(t){
  const W=lc.width,H=lc.height;
  lctx.fillStyle='#05050f';lctx.fillRect(0,0,W,H);
  if(t<0||t>=trace.length)return;
  const s=trace[t];const entries=s.slice(6);
  for(let i=0;i<64;i++){

function drawCurve(t){

    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);

}

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>囡囝共生 - 三维可视化</title>
<style>
body { margin: 0; font-family: monospace; background: #1a1a2e; color: #eee; }
#container { display: flex; }
#canvas { flex: 1; height: 100vh; }
#sidebar { width: 300px; padding: 20px; background: #16213e; }
h1 { color: #e94560; font-size: 1.2em; }
.stat { margin: 10px 0; padding: 10px; background: #0f3460; border-radius: 4px; }
.positive { color: #4ecca3; }
.negative { color: #e94560; }
</style>
</head>
<body>
<div id="container">
<canvas id="canvas"></canvas>
<div id="sidebar">
<h1>系统状态</h1><div class='stat'>总点数: 8<br>总线数: 3</div><h2>坐标点</h2><div class='stat' style='border-left: 3px solid #808080;'>1. color_base (0.0, 0.0, 0.0)</div><div class='stat' style='border-left: 3px solid #00c800;'>2. positive (1.0, 0.5, 0.0)</div><div class='stat' style='border-left: 3px solid #c80000;'>3. negative (-1.0, 0.5, 0.0)</div><div class='stat' style='border-left: 3px solid #00ff00;'>4. sound_base (0.0, 2.0, 0.0)</div><div class='stat' style='border-left: 3px solid #00c800;'>5. positive (1.0, 2.5, 0.0)</div><div class='stat' style='border-left: 3px solid #808080;'>6. relation_base (0.0, 4.0, 0.0)</div><div class='stat' style='border-left: 3px solid #0064ff;'>7. origin (0.0, 5.0, 0.0)</div><div class='stat' style='border-left: 3px solid #0064ff;'>8. partner (1.0, 5.0, 0.0)</div></div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = canvas.offsetWidth;
canvas.height = canvas.offsetHeight;

const points = [  {x: 0.00, y: 0.00, z: 0.00, r: 128, g: 128, b: 128, label: 'color_base', size: 1.5},
  {x: 1.00, y: 0.50, z: 0.00, r: 0, g: 200, b: 0, label: 'positive', size: 0.3},
  {x: -1.00, y: 0.50, z: 0.00, r: 200, g: 0, b: 0, label: 'negative', size: 0.3},
  {x: 0.00, y: 2.00, z: 0.00, r: 0, g: 255, b: 0, label: 'sound_base', size: 1.5},
  {x: 1.00, y: 2.50, z: 0.00, r: 0, g: 200, b: 0, label: 'positive', size: 0.3},
  {x: 0.00, y: 4.00, z: 0.00, r: 128, g: 128, b: 128, label: 'relation_base', size: 0.5},
  {x: 0.00, y: 5.00, z: 0.00, r: 0, g: 100, b: 255, label: 'origin', size: 0.5},
  {x: 1.00, y: 5.00, z: 0.00, r: 0, g: 100, b: 255, label: 'partner', size: 0.5}];

function project(x, y, z) {
  const scale = 50;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const perspective = 300;
  const factor = perspective / (perspective + z * scale);
  return {
    x: cx + x * scale * factor,
    y: cy - y * scale * factor,
    scale: factor
  };
}

function render() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 绘制网格
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 0.5;
  for (let i = -5; i <= 5; i++) {
    const p1 = project(i, 0, -5);
    const p2 = project(i, 0, 5);
    const p3 = project(-5, 0, i);
    const p4 = project(5, 0, i);
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.moveTo(p3.x, p3.y);
    ctx.lineTo(p4.x, p4.y);
    ctx.stroke();
  }

  // 绘制点
  for (const p of points) {
    const proj = project(p.x, p.y, p.z);
    const size = Math.max(2, p.size * 8 * proj.scale);
    ctx.fillStyle = `rgb(${p.r}, ${p.g}, ${p.b})`;
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '10px monospace';
    ctx.fillText(p.label, proj.x + size + 2, proj.y + 3);
  }
}

let angle = 0;
function animate() {
  angle += 0.005;
  for (const p of points) {
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    const nx = p.x * cos - p.z * sin;
    const nz = p.x * sin + p.z * cos;
    p.x = nx;
    p.z = nz;
  }
  render();
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>

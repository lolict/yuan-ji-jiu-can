<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>囡囝共生操作系统 · 天庭引擎 · 版本选择</title>
<style>
:root{--bg:#06060c;--panel:#0c0c16;--border:#1a1a2a;--gold:#c8a24e;--gold-dim:#7a6230;--green:#3a9a6a;--red:#a54a4a;--text:#d8d8e0;--text-dim:#5a5a7a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.center{text-align:center}
h1{font-size:2em;color:var(--gold);letter-spacing:.2em;margin-bottom:4px;text-shadow:0 0 30px rgba(200,162,78,.3)}
.sub{color:var(--text-dim);font-size:.85em;letter-spacing:.4em;margin-bottom:40px}
.versions{display:flex;flex-direction:column;gap:12px;width:480px;max-width:90vw}
.vrow{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1px solid var(--border);border-radius:8px;background:var(--panel);text-decoration:none;transition:all .2s}
.vrow:hover{border-color:var(--gold-dim);transform:translateX(4px);background:rgba(200,162,78,.04)}
.vnum{font-size:1.4em;color:var(--gold);font-weight:bold;min-width:36px}
.vinfo{flex:1}
.vn{font-size:.85em;color:var(--text);margin-bottom:2px}
.vd{font-size:.7em;color:var(--text-dim);line-height:1.4}
.vbadge{padding:2px 8px;border:1px solid var(--gold-dim);border-radius:6px;font-size:.6em;color:var(--gold)}
.divider{width:100%;height:1px;background:var(--border);margin:8px 0}
.principle{color:var(--text-dim);font-size:.7em;margin-top:30px;max-width:480px;text-align:center;line-height:1.6}
.principle strong{color:var(--gold)}
</style>
</head>
<body>
<div class="center">
  <h1>天庭</h1>
  <div class="sub">HEAVENLY_COURT · NJSG · 版本选择</div>

  <div class="versions">
    <a class="vrow" href="V1_benti_听觉系统_层级审判引擎.html">
      <div class="vnum">V1</div>
      <div class="vinfo"><div class="v">听觉系统 · 层级审判</div><div class="vd">听觉通道+层级轴+审判奖惩+历史记忆</div></div>
      <div class="vbadge">初版</div>
    </a>
    <a class="vrow" href="V2_benti_情为思判_过滤淘汰_完整七系统.html">
      <div class="vnum">V2</div>
      <div class="vinfo"><div class="v">七系统完整版</div><div class="vd">视觉·听觉·情进·行为·思考·审判·过滤淘汰</div></div>
      <div class="vbadge">完整版</div>
    </a>
    <a class="vrow" href="V3_公约数审判系统_七系统完整版.html">
      <div class="vnum">V3</div>
      <div class="vinfo"><div class="v">公约数审判引擎</div><div class="vd">公约数锚+公倍数照镜子+七系统+袋级认知</div></div>
      <div class="vbadge" style="border-color:var(--green);color:var(--green)">最新</div>
    </a>
  </div>

  <div class="principle">
    <strong>核心原则：</strong>根据公约数的锚对象，去围绕公约数旋转公倍数，<br>
    照镜子照出公约数的样子，去对比公倍数做的对不对。<br>
    <strong>不数粒，只问袋。</strong>岁岁数即为袋。层级不落入低维。
  </div>
</div>
</body>
</html>

[package]
name = "njsg_ime"
version = "2.0.0"
edition = "2021"
authors = ["囡囝共生 (刘楚恬 & lolict)"]

[lib]
name = "njsg_ime"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
once_cell = "1.19"

[profile.release]
opt-level = "s"
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
panic = "abort"

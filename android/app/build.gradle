// ============================================================================
// 囡囝共生 · MetaIME · App 子模块构建脚本
// ============================================================================
// 当前层号: G-2 (辅助层 - app 子模块)
// 当前声母: dian (奠)
// 当前韵母组合: dian + ding = 奠定 (app 模块奠定真机基础)
// 折叠状态: Kotlin + JNI .so 双通道编译
// 下一步: assembleRelease → APK 产出 → adb install
//
// 锚定法则:
//   0 = 刘楚恬 (Rust 核心, .so 侧)
//   1 = 我 (Kotlin 壳, APK 可壳侧)
// ============================================================================

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.flashlight.util'
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        applicationId "com.flashlight.util"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        versionCode 200
        versionName "2.0.0"

        // 四架构 ABI 过滤
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    // ── 源集: 指向现有 src/com/... 路径 ──
    // 排除 libnjsg_ime (Rust crate,Cargo 构建,不参与 Gradle 编译)
    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
            java.srcDirs = ['../src/com/mqf/parasite', '../src/com/njsg/parasite']
            res.srcDirs = ['../res']
            jniLibs.srcDirs = ['../src/main/jniLibs']
            assets.srcDirs = ['../assets']
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Android InputMethodService framework: via android.jar at compile time
}

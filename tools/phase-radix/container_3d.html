<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>容器空间 · 三维投影</title>
<style>
:root {
  --bg: #080c12; --panel: #111722; --border: #1a2535;
  --text: #c8d0dc; --muted: #4a5a6e; --green: #35d07f;
  --cyan: #3baded; --accent: #8b5cf6; --yellow: #e5a148;
  --pink: #ec4899; --blue: #60a5fa;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: --text; overflow: hidden; }
canvas { display: block; background: radial-gradient(ellipse at center, #0f1620 0%, #060a10 100%); }
#ui {
  position: fixed; top: 12px; left: 12px;
  background: rgba(17,23,34,0.92); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px; font-size: 10px; color: var(--text);
  max-width: 280px; backdrop-filter: blur(4px);
}
h1 { font-size: 11px; color: var(--accent); margin-bottom: 8px; }
h2 { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 8px 0 4px; }
.row { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px solid transparent; }
.row:hover { border-color: var(--border); }
.k { color: var(--muted); }
.v { color: var(--cyan); }
.legend { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.lg { display: flex; align-items: center; gap: 3px; }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.btn { background: var(--border); border: none; color: var(--text); padding: 3px 8px; border-radius: 3px; cursor: pointer; font-family: inherit; font-size: 10px; margin: 2px; }
.btn:hover { background: var(--accent); color: #fff; }
.btn.active { background: var(--green); color: #000; }
#controls { margin-top: 6px; }
select { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 10px; padding: 2px 4px; border-radius: 3px; font-family: inherit; }
.hint { color: var(--muted); font-size: 9px; margin-top: 6px; line-height: 1.4; }
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="ui">
  <h1>◈ 容器空间 · 三维投影</h1>
  <div class="row"><span class="k">细胞</span><span class="v" id="cCount">0</span></div>
  <div class="row"><span class="k">连接</span><span class="v" id="eCount">0</span></div>
  <div class="row"><span class="k">WASM</span><span class="v" id="wasmStatus">未加载</span></div>

  <h2>显示</h2>
  <div id="controls">
    <button class="btn active" onclick="toggleEdges()" id="btnEdges">连接</button>
    <button class="btn active" onclick="toggleLabels()" id="btnLabels">标签</button>
    <button class="btn" onclick="toggleGeo()" id="btnGeo">经纬网</button>
    <button class="btn" onclick="resetView()">复位</button>
    <button class="btn" onclick="autoRotate()" id="btnAuto">自转</button>
  </div>

  <h2>配色</h2>
  <select id="colorMode" onchange="redraw()">
    <option value="polarity">极性</option>
    <option value="sovereignty">主权值</option>
    <option value="witness">见证</option>
    <option value="flow">流</option>
    <option value="verdict">裁决态</option>
  </select>

  <h2>极性图例</h2>
  <div class="legend">
    <div class="lg"><div class="dot" style="background:#ec4899"></div>妻</div>
    <div class="lg"><div class="dot" style="background:#60a5fa"></div>夫</div>
    <div class="lg"><div class="dot" style="background:#35d07f"></div>系统</div>
    <div class="lg"><div class="dot" style="background:#e5a148"></div>观察</div>
    <div class="lg"><div class="dot" style="background:#8b5cf6"></div>裁决</div>
    <div class="lg"><div class="dot" style="background:#566578"></div>秘</div>
  </div>

  <div class="hint">
    拖拽旋转 · 滚轮缩放<br>
    主权 = 3D 位置 · 测地线 = 关系<br>
    X:sovereignty[20:14] Y:[13:7] Z:[6:0]
  </div>
</div>

<script src="wasm_bridge.js"></script>
<script>
// ============================================================
// 3D 容器空间 — 纯软件渲染
// 主权值 → 三维坐标 → 二维投影
// ============================================================
const canvas = document.getElementById('c3d');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── 细胞数据 ──
let CELLS = [];
let EDGES = [];

function parseCell(cell) {
  return {
    raw: cell,
    polarity: (cell >> 60) & 0xF,
    witness: (cell >> 56) & 0xF,
    flow: (cell >> 52) & 0xF,
    sovereignty: (cell >> 32) & 0x1FFFFF,
    mccp: cell & 0xFFFFFFFF,
  };
}

function cellToPosition(cell) {
  const sov = (cell >> 32) & 0x1FFFFF;
  // 21位主权值 → 3 × 7位 → (x, y, z) 各 [0,127]
  const x = (sov >> 14) & 0x7F;
  const y = (sov >> 7) & 0x7F;
  const z = sov & 0x7F;
  return { x, y, z };
}

// ── 相机 ──
let camRotX = -0.4, camRotY = 0.6, camZoom = 1.0;
let camDist = 200;
let dragging = false, lastMX = 0, lastMY = 0;
let autoRotateFlag = false;

canvas.addEventListener('mousedown', e => { dragging = true; lastMX = e.clientX; lastMY = e.clientY; });
canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  camRotY += (e.clientX - lastMX) * 0.008;
  camRotX += (e.clientY - lastMY) * 0.008;
  camRotX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camRotX));
  lastMX = e.clientX; lastMY = e.clientY;
  redraw();
});
canvas.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('mouseleave', () => dragging = false);
canvas.addEventListener('wheel', e => {
  camZoom *= e.deltaY < 0 ? 1.1 : 0.9;
  camZoom = Math.max(0.1, Math.min(5, camZoom));
  redraw();
});

// ── 3D → 2D 投影 ──
function project(p) {
  // 旋转: 绕 X 轴 (俯仰) 然后 绕 Y 轴 (偏航)
  const cx = Math.cos(camRotX), sx = Math.sin(camRotX);
  const cy = Math.cos(camRotY), sy = Math.sin(camRotY);

  // 绕 X 轴旋转
  let y1 = p.y * cx - p.z * sx;
  let z1 = p.y * sx + p.z * cx;
  // 绕 Y 轴旋转
  let x2 = p.x * cy + z1 * sy;
  let z2 = -p.x * sy + z1 * cy;

  // 透视投影
  const d = camDist;
  const perspective = d / (d + z2 + 150);
  const scale = perspective * camZoom * 3;

  return {
    sx: W / 2 + x2 * scale,
    sy: H / 2 - y1 * scale,
    depth: z2,
    scale: perspective * camZoom,
  };
}

// ── 计算细胞间关系与连接 ──
function computeEdges() {
  EDGES = [];
  const COLORS = { MERGE: '#35d07f', REPEL: '#e5484d', WITNESS: '#e5a148', TRANSFORM: '#8b5cf6', DEFER: '#566578', ESCALATE: '#3baded' };
  const POL_COLORS = ['#ec4899', '#60a5fa', '#35d07f', '#e5a148', '#8b5cf6', '#566578'];
  for (let i = 0; i < CELLS.length; i++) {
    for (let j = i + 1; j < CELLS.length; j++) {
      const a = CELLS[i], b = CELLS[j];
      // 本地 GCD 计算
      const sa = (a >> 32) & 0x1FFFFF;
      const sb = (b >> 32) & 0x1FFFFF;
      const g = gcd(sa, sb);
      const dist = g / Math.min(sa, sb);
      // 距离 < 0.3 弱的忽略
      if (dist >= 0.05) {
        // 简单裁决: 高GCD=融合, 低=排斥, 中间=见证
        let verdict;
        if (dist >= 0.5) verdict = 'MERGE';
        else if (dist >= 0.15) verdict = 'WITNESS';
        else verdict = 'REPEL';
        EDGES.push({ a: i, b: j, dist, verdict, color: COLORS[verdict] });
      }
    }
  }
}

function gcd(a, b) { while (b) { [a, b] = [b, a % b]; } return a; }

// ── 经纬网 (可选) ──
let showGeo = false, showEdges = true, showLabels = true;
function toggleEdges() { showEdges = !showEdges; document.getElementById('btnEdges').classList.toggle('active', showEdges); redraw(); }
function toggleLabels() { showLabels = !showLabels; document.getElementById('btnLabels').classList.toggle('active', showLabels); redraw(); }
function toggleGeo() { showGeo = !showGeo; document.getElementById('btnGeo').classList.toggle('active', showGeo); redraw(); }
function resetView() { camRotX = -0.4; camRotY = 0.6; camZoom = 1.0; redraw(); }
function autoRotate() { autoRotateFlag = !autoRotateFlag; document.getElementById('btnAuto').classList.toggle('active', autoRotateFlag); if (autoRotateFlag) requestAnimationFrame(autoRotateFrame); }

function autoRotateFrame() {
  if (!autoRotateFlag) return;
  camRotY += 0.01;
  redraw();
  requestAnimationFrame(autoRotateFrame);
}

// ── 渲染循环 ──
function redraw() {
  ctx.clearRect(0, 0, W, H);

  // 经纬网
  if (showGeo) drawGeoGrid();

  // 投影所有细胞
  const projected = CELLS.map((c, i) => {
    const p = cellToPosition(c);
    const pr = project(p);
    return { idx: i, cell: c, pos: p, pr };
  });

  // 排序: 远到近
  projected.sort((a, b) => a.pr.depth - b.pr.depth);

  // 绘制连接
  if (showEdges && EDGES.length < 2000) {
    for (const e of EDGES) {
      const pa = projected.find(p => p.idx === e.a);
      const pb = projected.find(p => p.idx === e.b);
      if (!pa || !pb) continue;
      ctx.strokeStyle = e.color;
      ctx.globalAlpha = 0.3 + e.dist * 0.5;
      ctx.lineWidth = Math.max(0.5, e.dist * 2);
      ctx.beginPath();
      ctx.moveTo(pa.pr.sx, pa.pr.sy);
      ctx.lineTo(pb.pr.sx, pb.pr.sy);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // 绘制细胞
  const colorMode = document.getElementById('colorMode').value;
  for (const p of projected) {
    const c = parseCell(p.cell);
    let color;
    if (colorMode === 'polarity') color = ['#ec4899', '#60a5fa', '#35d07f', '#e5a148', '#8b5cf6', '#566578'][Math.min(c.polarity, 5)] || '#888';
    else if (colorMode === 'sovereignty') {
      const t = Math.min(c.sovereignty / 5000, 1);
      color = `hsl(${200 + t * 160}, 70%, ${40 + t * 30}%)`;
    } else if (colorMode === 'witness') {
      const t = c.witness / 15;
      color = `hsl(${120 - t * 120}, 70%, 50%)`;
    } else if (colorMode === 'flow') {
      const hues = [200, 280, 340, 60, 120, 0, 160, 30];
      color = `hsl(${hues[c.flow] || 0}, 70%, 55%)`;
    } else {
      // verdict: 取该细胞参与的所有边的裁决
      const related = EDGES.filter(e => e.a === p.idx || e.b === p.idx);
      const best = related.sort((a, b) => b.dist - a.dist)[0];
      color = best ? best.color : '#555';
    }

    const radius = (2 + c.witness * 0.4) * p.pr.scale * 5;
    const alpha = 0.4 + (p.pr.depth + 150) / 300 * 0.6;

    ctx.globalAlpha = Math.min(alpha, 1);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(p.pr.sx, p.pr.sy, Math.max(1.5, radius), 0, Math.PI * 2);
    ctx.fill();

    // 高光
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(p.pr.sx - radius * 0.3, p.pr.sy - radius * 0.3, radius * 0.3, 0, Math.PI * 2);
    ctx.fill();

    // 标签
    if (showLabels && radius > 3) {
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = '#fff';
      ctx.font = `${Math.max(8, Math.min(11, radius))}px JetBrains Mono`;
      ctx.textAlign = 'center';
      ctx.fillText(`${c.sovereignty}`, p.pr.sx, p.pr.sy + radius + 10);
    }
  }
  ctx.globalAlpha = 1;

  document.getElementById('cCount').textContent = CELLS.length;
  document.getElementById('eCount').textContent = EDGES.length;
}

function drawGeoGrid() {
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 0.5;
  const step = 10;
  // XY 平面
  for (let x = 0; x <= 128; x += step) {
    const p1 = project({ x, y: 0, z: 0 });
    const p2 = project({ x, y: 128, z: 0 });
    ctx.beginPath(); ctx.moveTo(p1.sx, p1.sy); ctx.lineTo(p2.sx, p2.sy); ctx.stroke();
  }
  for (let y = 0; y <= 128; y += step) {
    const p1 = project({ x: 0, y, z: 0 });
    const p2 = project({ x: 128, y, z: 0 });
    ctx.beginPath(); ctx.moveTo(p1.sx, p1.sy); ctx.lineTo(p2.sx, p2.sy); ctx.stroke();
  }
}

// ── 加载细胞数据 ──
function setCells(cells) {
  CELLS = cells;
  computeEdges();
  redraw();
}

// 示例: 囡囝共生标准测试集
function loadDemo() {
  const cells = [
    0x20009D800001000,  // 妻 主权=2520 LCM锚点
    0x1200003C00002000,  // 夫 主权=60
    0x230002D000030000,  // 系统 主权=720
    0x0100000700004000,  // 妻 主权=7
    0x1200034800005000,  // 夫 主权=840
    0x2300000800006000,  // 系统 主权=8
    0x0100000900007000,  // 妻 主权=9
    0x1200000A00008000,  // 夫 主权=10
  ];
  setCells(cells);
}

// ── WASM 接入 ──
async function initWasmAndRun() {
  const ok = await WasmBridge.init('wasm64');
  if (ok) {
    WasmBridge.boot();
    document.getElementById('wasmStatus').textContent = WasmBridge.target();
    // WASM 就绪后, 可以用 WASM 弧距离重新计算连接精度
    enhanceWithWasm();
  } else {
    document.getElementById('wasmStatus').textContent = '失败 (纯本地)';
  }
}

function enhanceWithWasm() {
  // 使用 WASM 弧距离增强关系精度
  for (const e of EDGES) {
    const a = parseCell(CELLS[e.a]);
    const b = parseCell(CELLS[e.b]);
    const angleA = WasmBridge.cellToAngle(CELLS[e.a]);
    const angleB = WasmBridge.cellToAngle(CELLS[e.b]);
    const arcDist = WasmBridge.cellsArcDistance(CELLS[e.a], CELLS[e.b]);
    e.wasmArc = arcDist;
  }
  redraw();
}

// ── 初始化 ──
window.addEventListener('load', () => {
  loadDemo();
  initWasmAndRun();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>天庭空间 · 细胞交互模拟器</title>
<style>
:root {
  --bg: #0a0e14; --panel: #131820; --border: #1e2836;
  --text: #c8d0dc; --muted: #566578; --green: #35d07f;
  --red: #e5484d; --yellow: #e5a148; --cyan: #3baded;
  --accent: #8b5cf6; --accent2: #ec4899; --pink: #f472b6;
  --blue: #60a5fa;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: var(--text); min-height: 100vh; }
a { color: var(--cyan); }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.05em; margin-bottom: 16px; color: var(--accent); }
.grid { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 14px; }
.panel h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
canvas { background: radial-gradient(ellipse at center, #0f1620 0%, #080c12 100%); border: 1px solid var(--border); border-radius: 6px; display: block; cursor: crosshair; }
.input-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
label { font-size: 10px; color: var(--muted); min-width: 50px; }
input, select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 3px 6px; font-size: 11px; border-radius: 3px; font-family: inherit; }
.btn { background: var(--border); border: none; color: var(--text); padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 11px; font-family: inherit; transition: background 0.15s; }
.btn:hover { background: var(--accent); color: #fff; }
.btn-success { background: var(--green); color: #000; }
.btn-danger { background: var(--red); color: #fff; }
.btn-secondary { background: var(--bg); border: 1px solid var(--border); }
.log { font-size: 10px; line-height: 1.6; color: var(--muted); max-height: 200px; overflow-y: auto; white-space: pre-wrap; margin-top: 6px; }
.cell-table { font-size: 10px; width: 100%; border-collapse: collapse; }
.cell-table th { text-align: left; padding: 3px; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); }
.cell-table td { padding: 3px; border-bottom: 1px solid var(--border); }
.verdict-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 10px; margin-top: 6px; }
.verdict-item { display: flex; align-items: center; gap: 3px; }
.verdict-color { width: 10px; height: 10px; border-radius: 2px; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="container">
  <h1>◈ 天庭空间 · 细胞交互模拟器</h1>
  <div class="grid">
    <div>
      <canvas id="sim" width="900" height="520"></canvas>
      <div class="verdict-legend">
        <div class="verdict-item"><div class="verdict-color" style="background:#35d07f"></div>融合</div>
        <div class="verdict-item"><div class="verdict-color" style="background:#e5484d"></div>排斥</div>
        <div class="verdict-item"><div class="verdict-color" style="background:#e5a148"></div>见证</div>
        <div class="verdict-item"><div class="verdict-color" style="background:#8b5cf6"></div>转化</div>
        <div class="verdict-item"><div class="verdict-color" style="background:#566578"></div>延迟</div>
        <div class="verdict-item"><div class="verdict-color" style="background:#3baded"></div>升维</div>
      </div>
    </div>
    <div>
      <div class="panel">
        <h2>控制</h2>
        <div class="toolbar">
          <button class="btn btn-success" onclick="addRandomCell()">+ 添加细胞</button>
          <button class="btn btn-danger" onclick="runSimulation()">▶ 运行裁决</button>
          <button class="btn btn-secondary" onclick="resetSim()">↺ 重置</button>
          <button class="btn btn-secondary" onclick="setStateFromSelector()">设态</button>
        </div>
        <div class="input-row">
          <label>囡囝态</label>
          <select id="sim-state">
            <option value="0">囡囡(NN)</option>
            <option value="1" selected>囡囝(NJSG)</option>
            <option value="2">囝囝(JJ)</option>
            <option value="3">囝囡(JN)</option>
          </select>
        </div>
        <div class="input-row">
          <label>速度</label>
          <input type="range" id="sim-speed" min="1" max="10" value="5" style="flex:1;">
        </div>
        <div class="input-row">
          <label>运行</label>
          <input type="checkbox" id="sim-auto" checked>
          <span style="font-size:10px;color:var(--muted)">连续裁决</span>
        </div>
      </div>
      <div class="panel" style="margin-top:10px;">
        <h2>细胞列表 (<span id="cell-count">0</span>)</h2>
        <table class="cell-table">
          <thead><tr><th></th><th>MCCP</th><th>极性</th><th>主权</th></tr></thead>
          <tbody id="cell-list"></tbody>
        </table>
      </div>
      <div class="panel" style="margin-top:10px;">
        <h2>裁决记录</h2>
        <div id="sim-log" class="log">等待运行...</div>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('sim');
const ctx = canvas.getContext('2d');
const COLORS = {
  wife: '#f472b6', husband: '#60a5fa', system: '#35d07f',
  verdict: ['', '#35d07f', '#e5484d', '#e5a148', '#8b5cf6', '#566578', '#3baded']
};
const STATE_NAMES = ['囡囡(NN)', '囡囝(NJSG)', '囝囝(JJ)', '囝囡(JN)'];
const POL_NAMES = ['妻', '夫', '系统'];
const VERDICT_NAMES = ['', 'MERGE', 'REPEL', 'WITNESS', 'TRANSFORM', 'DEFER', 'ESCALATE'];

let cells = [];
let history = [];
let animFrame = null;
let autoTimer = null;

// 细胞间基于主权距离计算引力/斥力布局
function computeLayout() {
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  // 简单径向布局：按主权距离围绕中心排列
  const n = cells.length;
  if (n === 0) return;
  
  cells.forEach((c, i) => {
    if (c.x === undefined) {
      const angle = (i / Math.max(n, 1)) * Math.PI * 2;
      const r = 80 + (n > 1 ? (i * 30) % 150 : 0);
      c.x = cx + Math.cos(angle) * r;
      c.y = cy + Math.sin(angle) * r;
      c.vx = 0; c.vy = 0;
    }
  });
  
  // 力导向：细胞间用力
  const REPEL = 800, ATTRACT = 0.005;
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const dx = cells[j].x - cells[i].x;
      const dy = cells[j].y - cells[i].y;
      const dist2 = dx * dx + dy * dy || 1;
      const dist = Math.sqrt(dist2);
      let force = 0;
      
      if (dist < 100) force = REPEL / dist2;  // 近距排斥
      else force = -ATTRACT * dist * 0.1;     // 远距微弱吸引
      
      const fx = (dx / dist) * force;
      const fy = (dy / dist) * force;
      cells[i].vx -= fx; cells[i].vy -= fy;
      cells[j].vx += fx; cells[j].vy += fy;
    }
    // 中心引力
    cells[i].vx += (cx - cells[i].x) * 0.001;
    cells[i].vy += (cy - cells[i].y) * 0.001;
    // 阻尼
    cells[i].vx *= 0.9; cells[i].vy *= 0.9;
    // 边界
    cells[i].x = Math.max(30, Math.min(W - 30, cells[i].x));
    cells[i].y = Math.max(30, Math.min(H - 30, cells[i].y));
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // 绘制细胞间连线（最近邻）
  if (cells.length >= 2) {
    for (let i = 0; i < cells.length; i++) {
      for (let j = i + 1; j < cells.length; j++) {
        const dx = cells[j].x - cells[i].x;
        const dy = cells[j].y - cells[i].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 200) {
          const verdict = provisionalVerdict(cells[i], cells[j]);
          ctx.strokeStyle = COLORS.verdict[verdict] || 'var(--border)';
          ctx.globalAlpha = Math.max(0.1, 1 - dist / 200);
          ctx.lineWidth = verdict === 1 ? 2 : 1;
          if (verdict === 2) ctx.setLineDash([5, 5]);
          else ctx.setLineDash([]);
          ctx.beginPath();
          ctx.moveTo(cells[i].x, cells[i].y);
          ctx.lineTo(cells[j].x, cells[j].y);
          ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.setLineDash([]);
        }
      }
    }
  }
  
  // 绘制细胞
  cells.forEach((c, i) => {
    const color = c.polarity === 0 ? COLORS.wife : c.polarity === 1 ? COLORS.husband : COLORS.system;
    // 外圈（见证等级）
    if (c.witness > 0) {
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.3;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(c.x, c.y, 12 + c.witness * 2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // 主圆
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
    ctx.fill();
    // 标签
    ctx.fillStyle = '#fff';
    ctx.font = '9px JetBrains Mono';
    ctx.textAlign = 'center';
    ctx.fillText(`0x${c.mccp.toString(16).toUpperCase()}`, c.x, c.y - 15);
  });
  
  // 状态标签
  ctx.fillStyle = 'var(--muted)';
  ctx.font = '11px JetBrains Mono';
  ctx.textAlign = 'left';
  const stateIdx = parseInt(document.getElementById('sim-state').value);
  ctx.fillText(`态: ${STATE_NAMES[stateIdx]}`, 10, 20);
  ctx.fillText(`细胞: ${cells.length}`, 10, 36);
  ctx.fillText(`裁决: ${history.length}`, 10, 52);
}

function provisionalVerdict(a, b) {
  const stateIdx = parseInt(document.getElementById('sim-state').value);
  // 简化裁决逻辑
  if (a.polarity === b.polarity && stateIdx === 2) return 2; // JJ 同极性 -> REPEL
  if (a.polarity !== b.polarity && stateIdx === 0) return 2; // NN 异极性 -> REPEL
  if (a.polarity === b.polarity && stateIdx === 0) return 1; // NN 同极性 -> MERGE
  const sovDist = sovereigntyDist(a.sovereignty, b.sovereignty);
  if (sovDist < 0.2) return 1; // 主权近
  if (sovDist > 0.8) return 2; // 主权远
  return 4; // 默认 TRANSFORM
}

function sovereigntyDist(a, b) {
  if (a === b) return 0;
  const gcd = (x, y) => { while (y) { const t = y; y = x % y; x = t; } return x; };
  const g = gcd(a, b);
  if (g === 1) return 0.9;
  const r = g / Math.min(a, b);
  return 1 - r;
}

function updateUI() {
  document.getElementById('cell-count').textContent = cells.length;
  const tbody = document.getElementById('cell-list');
  tbody.innerHTML = cells.map((c, i) =>
    `<tr>
      <td style="color:${c.polarity === 0 ? 'var(--pink)' : c.polarity === 1 ? 'var(--blue)' : 'var(--green)'}">${POL_NAMES[c.polarity]}</td>
      <td>0x${c.mccp.toString(16).toUpperCase()}</td>
      <td>${c.polarity}</td>
      <td>0x${c.sovereignty.toString(16).toUpperCase()}</td>
    </tr>`
  ).join('');
}

function animate() {
  computeLayout();
  draw();
  animFrame = requestAnimationFrame(animate);
}

function addRandomCell() {
  const pol = Math.floor(Math.random() * 3);
  const mccp = Math.floor(Math.random() * 0xFFF) + 0x100;
  const sov = (Math.floor(Math.random() * 20) + 1) * 0x1000;
  cells.push({
    mccp, sovereignty: sov, polarity: pol, witness: Math.floor(Math.random() * 4),
    x: undefined, y: undefined, vx: 0, vy: 0
  });
  updateUI();
  log(`添加细胞: 0x${(mccp >>> 0).toString(16).toUpperCase()} [${POL_NAMES[pol]}]`);
}

// 调用真实天庭 API 进行裁决
async function api_post(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  return r.json();
}

async function realCourtJudge(a, b) {
  try {
    const stateIdx = parseInt(document.getElementById('sim-state').value);
    await api_post('/api/court/state', { state: stateIdx });
    await api_post('/api/court/flow', { flow: 7 });
    // cell 编码: [63:60]=pol [59:56]=wit [55:52]=flow [51:32]=sov(21bit) [31:0]=mccp
    const cellA = (BigInt(a.polarity) << 60n) | (BigInt(a.witness) << 56n) | (BigInt(a.sovereignty) << 32n) | BigInt(a.mccp);
    const cellB = (BigInt(b.polarity) << 60n) | (BigInt(b.witness) << 56n) | (BigInt(b.sovereignty) << 32n) | BigInt(b.mccp);
    const r = await api_post('/api/court/judge', {
      cell_a: '0x' + cellA.toString(16).toUpperCase(),
      cell_b: '0x' + cellB.toString(16).toUpperCase(),
      flow: 7
    });
    return r;
  } catch(e) {
    console.warn('API 调用失败, 使用本地逻辑:', e);
    return { verdict: provisionalVerdict(a, b), confidence: 0.5, verdict_str: 'LOCAL', reason_str: 'API 不可用' };
  }
}

async function runSimulation() {
  if (cells.length < 2) { log('需要至少 2 个细胞', 'err'); return; }
  const speed = parseInt(document.getElementById('sim-speed').value);
  
  async function step() {
    for (let s = 0; s < speed && cells.length >= 2; s++) {
      const i = Math.floor(Math.random() * cells.length);
      let j = Math.floor(Math.random() * cells.length);
      while (j === i) j = Math.floor(Math.random() * cells.length);
      
      const a = cells[i], b = cells[j];
      const r = await realCourtJudge(a, b);
      const v = r.verdict;
      
      if (v === 1) {
        cells.splice(j, 1);
        log(`融合: 0x${a.mccp.toString(16).toUpperCase()} + 0x${b.mccp.toString(16).toUpperCase()} → 0x${a.mccp.toString(16).toUpperCase()}`, 'merge');
      } else if (v === 4) {
        a.polarity = (a.polarity + 1) % 3;
        log(`转化: 0x${a.mccp.toString(16).toUpperCase()} 极性→${POL_NAMES[a.polarity]}`, 'transform');
      } else if (v === 2) {
        log(`排斥: 0x${a.mccp.toString(16).toUpperCase()} // 0x${b.mccp.toString(16).toUpperCase()}`, 'repel');
      } else if (v === 3) {
        a.witness = Math.min(15, a.witness + 1);
        log(`见证: 0x${a.mccp.toString(16).toUpperCase()} wit→${a.witness}`, 'info');
      } else {
        log(`${r.verdict_str || '?'}: 0x${a.mccp.toString(16).toUpperCase()} × 0x${b.mccp.toString(16).toUpperCase()}`, 'info');
      }
      updateUI();
      if (cells.length < 2) break;
    }
    if (document.getElementById('sim-auto').checked && cells.length >= 2) {
      autoTimer = setTimeout(step, 300);
    }
  }
  step();
}

function resetSim() {
  cells = [];
  history = [];
  if (autoTimer) clearTimeout(autoTimer);
  updateUI();
  document.getElementById('sim-log').textContent = '等待运行...';
  log('已重置');
}

function setStateFromSelector() {
  const stateIdx = parseInt(document.getElementById('sim-state').value);
  log(`态设置为: ${STATE_NAMES[stateIdx]}`, 'info');
}

function log(msg, type) {
  const el = document.getElementById('sim-log');
  const color = type === 'merge' ? 'var(--green)' :
                type === 'repel' ? 'var(--red)' :
                type === 'transform' ? 'var(--accent)' :
                type === 'err' ? 'var(--red)' : 'var(--cyan)';
  el.innerHTML = `<span style="color:${color}">${new Date().toLocaleTimeString()} ${msg}</span>\n` + el.innerHTML;
}

// 添加一些初始细胞
function init() {
  cells = [
    { mccp: 0x100, sovereignty: 0x10000, polarity: 0, witness: 2 },
    { mccp: 0x200, sovereignty: 0x10000, polarity: 1, witness: 1 },
    { mccp: 0x300, sovereignty: 0x20000, polarity: 2, witness: 3 },
    { mccp: 0x400, sovereignty: 0x10000, polarity: 0, witness: 1 },
  ];
  cells.forEach((c, i) => {
    const angle = (i / 4) * Math.PI * 2;
    c.x = canvas.width / 2 + Math.cos(angle) * 120;
    c.y = canvas.height / 2 + Math.sin(angle) * 120;
    c.vx = 0; c.vy = 0;
  });
  updateUI();
  animate();
}

init();
</script>
</body>
</html>

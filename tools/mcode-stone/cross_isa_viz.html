const ISA_ORDER = ["riscv32", "arm64", "x86_64", "mips32"];
const ISA_LABELS = {"riscv32": "RISC-V", "arm64": "ARM64", "x86_64": "x86-64", "mips32": "MIPS32"};
const ISA_CLS = {"riscv32": "isa-rv", "arm64": "isa-arm", "x86_64": "isa-x64", "mips32": "isa-mips"};

const tb = document.getElementById('tb');
const fIsa = document.getElementById('fIsa');
const fType = document.getElementById('fType');
const fQ = document.getElementById('fQ');
const cnt = document.getElementById('cnt');

function tc(cls, txt) { return '<span class="'+cls+'">'+txt+'</span>'; }
function typeTag(t) { return t ? '<span class="tf tf-'+t+'">'+t+'</span>' : ''; }

function render(rows) {
  tb.innerHTML = '';
  let n = 0;
  rows.forEach(function(r) {
    if (fQ.value && r.sem_id.toLowerCase().indexOf(fQ.value.toLowerCase()) < 0) return;
    const tr = document.createElement('tr');
    let html = '<td><span class="sem">'+r.sem_id+'</span></td>';
    ISA_ORDER.forEach(function(isa) {
      const d = r.isas[isa] || {};
      const ic = ISA_CLS[isa];
      html += '<td>';
      html += tc(ic, d.inst_id || '—');
      if (d.mnemonic) html += ' <span style="color:var(--dim);font-size:0.8em">'+d.mnemonic+'</span>';
      html += ' ' + typeTag(d.type);
      if (d.hex && d.hex !== 'ERR') {
        html += '<br><span class="hex">' + d.hex + '</span> ';
        html += d.ok ? '<span class="ok">✓</span>' : '<span class="er">✗</span>';
      } else if (d.hex === 'ERR') {
        html += '<br><span class="er">'+(d.err||'')+'</span>';
      }
      html += '</td>';
    });
    tr.innerHTML = html;
    tr.style.cursor = 'pointer';
    tr.onclick = function() { showDetail(r); };
    tb.appendChild(tr);
    n++;
  });
  cnt.textContent = n + ' / 40 行';
}

function showDetail(r) {
  const det = document.getElementById('det');
  document.getElementById('detH').textContent = r.sem_id;
  const t = document.getElementById('detT');
  let h = '<tr><td class="kl">ISA</td><td class="kl">Instruction</td><td class="kl">Mnemonic</td><td class="kl">Type</td><td class="kl">Machine Code</td><td class="kl">Round-Trip</td></tr>';
  ISA_ORDER.forEach(function(isa) {
    const d = r.isas[isa] || {};
    h += '<tr><td><b class="'+ISA_CLS[isa]+'">'+ISA_LABELS[isa]+'</b></td>';
    h += '<td>'+(d.inst_id||'—')+'</td><td>'+(d.mnemonic||'—')+'</td><td>'+(d.type||'—')+'</td>';
    h += '<td><span class="hex">'+(d.hex||'—')+'</span></td>';
    h += '<td>'+(d.hex==='ERR'?'<span class="er">ERR</span>':d.ok?'<span class="ok">✓</span>':'<span class="er">✗</span>')+'</td></tr>';
  });
  t.innerHTML = h;
  det.style.display = 'block';
}

function applyFilter() {
  let filtered = DATA;
  if (fType.value !== 'all') {
    filtered = filtered.filter(function(r) {
      return ISA_ORDER.some(function(isa) { return (r.isas[isa]||{}).type === fType.value; });
    });
  }
  render(filtered);
}

render(DATA);

[package]
name = "mqf"
version = "0.3.0"
autobins = false
edition = "2021"
authors = ["lolict & 刘楚恬 <mqf@manquanca.info>"]
description = "囡囝共生 · 囡囝共生元 OS — Rust 核心"
license = "Proprietary"
repository = "https://github.com/lolict/hunyuan-os"

[dependencies]
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.21"

[build-dependencies]
cc = "1"

[lib]
name = "mqf"
path = "src/lib.rs"

[[bin]]
name = "mqf"
path = "src/main.rs"

[[bin]]
name = "court"
path = "src/bin/court.rs"

[[bin]]
name = "e2e-demo"
path = "src/bin/e2e_demo.rs"

[[bin]]
name = "glyph"
path = "src/bin/glyph.rs"

[[bin]]
name = "isa-encode"
path = "src/bin/isa-encode.rs"

[[bin]]
name = "morphism"
path = "src/bin/morphism_gen.rs"

[[bin]]
name = "njsg-capture"
path = "src/bin/njsg-capture.rs"

[[bin]]
name = "njsg-server"
path = "src/bin/njsg-server.rs"

[[bin]]
name = "ttf-exec"
path = "src/bin/ttf_exec.rs"

[[bin]]
name = "ttf-gen"
path = "src/bin/ttf_gen.rs"

[[bin]]
name = "ttf-view"
path = "src/bin/ttf_view.rs"

[[bin]]
name = "state-enumerate"
path = "src/bin/state_enumerate.rs"

[profile.release]
opt-level = "z"      # 体积优先
lto = true           # 链接期优化
strip = true         # 去除符号
codegen-units = 1    # 单 CGU 利于 LTO
panic = "abort"

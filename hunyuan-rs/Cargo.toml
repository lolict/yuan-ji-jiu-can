[package]
name = "mqf"
version = "0.3.0"
autobins = false
edition = "2021"
authors = ["lolict & 刘楚恬 <mqf@manquanca.info>"]
description = "囡囝共生 · 囡囝共生元 OS — Rust 核心"
license = "Proprietary"
repository = "https://github.com/lolict/hunyuan-os"

[lib]
name = "mqf"
path = "src/lib.rs"

[dependencies]
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.21"
ttf-parser = "0.25"
image = "0.25"
base64 = "0.21"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[build-dependencies]
cc = "1"

[[bin]]
name = "mqf"
path = "src/main.rs"

[[bin]]
name = "court"
path = "src/bin/court.rs"

[[bin]]
name = "e2e-demo"
path = "src/bin/e2e_demo.rs"

[[bin]]
name = "font-renderer"
path = "src/bin/font_renderer.rs"

[[bin]]
name = "glyph"
path = "src/bin/glyph.rs"

[[bin]]
name = "isa-encode"
path = "src/bin/isa-encode.rs"

[[bin]]
name = "container-capture"
path = "src/bin/container-capture.rs"

[[bin]]
name = "container-view"
path = "src/bin/container-view.rs"

[[bin]]
name = "container-geom"
path = "src/bin/container-geom.rs"

[[bin]]
name = "container-space"
path = "src/bin/container-space.rs"

[[bin]]
name = "fq-radix"
path = "src/bin/fq-radix.rs"

[[bin]]
name = "fq-var"
path = "src/bin/fq-var.rs"

[[bin]]
name = "njsg-server"
path = "src/bin/njsg-server.rs"

[[bin]]
name = "ttf-exec"
path = "src/bin/ttf_exec.rs"

[[bin]]
name = "ttf-gen"
path = "src/bin/ttf_gen.rs"

[[bin]]
name = "ttf-view"
path = "src/bin/ttf_view.rs"

[[bin]]
name = "ttf-mirror"
path = "src/bin/ttf_mirror.rs"

[[bin]]
name = "ttf-cognize"
path = "src/bin/ttf_cognize.rs"

[[bin]]
name = "ttf-field"
path = "src/bin/ttf_field.rs"

[[bin]]
name = "ttf-timeline"
path = "src/bin/ttf_timeline.rs"

[[bin]]
name = "ttf-sky"
path = "src/bin/ttf_sky.rs"

[[bin]]
name = "lvma"
path = "src/bin/lvma.rs"

[[bin]]
name = "state-enumerate"
path = "src/bin/state_enumerate.rs"

[[bin]]
name = "state-ttf-gen"
path = "src/bin/state_ttf_gen.rs"

[[bin]]
name = "stats-browser"
path = "src/bin/stats_browser.rs"

[[bin]]
name = "global-rename"
path = "src/bin/global_rename.rs"

[profile.release]
opt-level = "z"      # 体积优先
lto = true           # 链接期优化
strip = true         # 去除符号
codegen-units = 1    # 单 CGU 利于 LTO
panic = "abort"

[[bin]]
name = "pipeline"
path = "src/bin/pipeline.rs"

[[bin]]
name = "char-create"
path = "src/bin/char_create.rs"

[[bin]]
name = "visual-glyph"
path = "src/bin/visual_glyph.rs"

[[bin]]
name = "container-runtime"
path = "src/bin/container_runtime.rs"

[[bin]]
name = "container-time-fridge"
path = "src/bin/container_time_fridge.rs"

[[bin]]

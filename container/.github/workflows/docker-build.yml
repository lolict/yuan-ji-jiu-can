# 满全法容器镜像自动构建
# 触发条件: main 分支 push / tag v* / PR / 手动触发
# 推送到 GHCR (GitHub Container Registry, 私有仓库免费)

name: 构建满全法容器镜像

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      hunyuan_os_ref:
        description: 'hunyuan-os 引用 (分支/tag/commit)'
        required: true
        default: 'main'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出容器仓库
        uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HUNYUAN_OS_REF=${{ inputs.hunyuan_os_ref || 'main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像摘要
        run: |
          echo "镜像: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "标签: ${{ steps.meta.outputs.tags }}"
          echo "hunyuan-os 引用: ${{ inputs.hunyuan_os_ref || 'main' }}"
